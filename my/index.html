<style>
  :root {
    --bg: #F1F5F9; --card: #FFFFFF; --line: #E2E8F0; --line-2: #CBD5E1;
    --text: #1E293B; --muted: #64748B; --muted-2: #475569;
    --blue: #1660D6; --blue-d: #0F4FB8; --blue-l: #DBEAFE;
    --gold: #F5B301; --green: #047857; --green-l: #D1FAE5; --rose: #BE123C; --rose-l: #FFE4E6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif; min-height: 100vh; }
  button { font: inherit; }
  .hidden { display: none !important; }

  .hero { background: linear-gradient(90deg, #0F4FB8, #1D8CF0); color: #fff; padding: 0 16px 72px; }
  .hero-inner { max-width: 720px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
  .brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: #fff; overflow: hidden; box-shadow: 0 2px 8px rgba(15,23,42,.18); }
  .logo img { width: 100%; height: 100%; display: block; }
  .brand-name { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  .brand-sub { font-size: 11px; color: #DBEAFE; letter-spacing: .5px; }
  .back { color: #fff; text-decoration: none; font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.18); }
  .back:hover { background: rgba(255,255,255,.28); }
  .back:focus-visible, .bill:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .greet h1 { margin: 8px 0 4px; font-size: 24px; letter-spacing: 1px; }
  .greet p { margin: 0; font-size: 14px; color: #DBEAFE; }

  main { max-width: 720px; margin: -52px auto 0; padding: 0 16px 80px; }
  .panel { background: var(--card); border-radius: 18px; box-shadow: 0 10px 30px rgba(15,23,42,.08); padding: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 16px; letter-spacing: 1px; }
  .list { display: grid; gap: 10px; }
  .bill { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 14px; cursor: pointer; color: inherit; }
  .bill:hover { border-color: var(--blue); background: #F8FBFF; }
  .bill .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .bill .ttl { font-weight: 700; font-size: 16px; }
  .bill .amt { font-weight: 700; font-size: 20px; color: var(--blue-d); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bill .r2 { margin-top: 6px; font-size: 13px; color: var(--muted-2); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--blue-l); color: var(--blue-d); }
  .chip.neg { background: var(--green-l); color: var(--green); }
  .new { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--gold); color: var(--text); margin-left: 6px; vertical-align: 2px; }
  .empty { text-align: center; color: var(--muted); padding: 36px 12px; line-height: 1.8; }
  .err { background: var(--rose-l); color: var(--rose); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }
  .help { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 14px 2px 0; }

  .adminbar { background: #FEF3C7; color: #92400E; border: 1px solid #FCD34D; border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; align-items: center; }
  .adminbar .acts { display: flex; gap: 14px; }
  .adminbar a { color: #92400E; font-weight: 700; }
  .pickbar { display: flex; gap: 8px; margin-bottom: 10px; }
  .pickbar .search { margin-bottom: 0; }
  .pickbar #pickQ { flex: 1; min-width: 0; }
  .pickbar #pickG { width: 8.5em; flex: none; background: #fff; }
  .search { width: 100%; border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-size: 15px; margin-bottom: 10px; }
  .plist { border: 1px solid var(--line); border-radius: 12px; max-height: 56vh; overflow: auto; }
  .plist a { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
  .plist a:last-child { border-bottom: 0; }
  .plist a:hover, .plist a:focus-visible { background: #F0F7FF; outline: none; }
  .plist small { color: var(--muted); }
  .st { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .st.paid { background: var(--green-l); color: var(--green); }
  .st.pending { background: #FEF3C7; color: #92400E; }
  .st.overdue { background: var(--rose-l); color: var(--rose); }
  .st.unpaid { background: #E2E8F0; color: var(--muted-2); }
  .st.partial { background: #FFEDD5; color: #C2410C; }
  .st.rejected { background: var(--rose-l); color: var(--rose); }
  .paysec { margin: 14px 2px 4px; }
  .paysec h3 { margin: 0 0 8px; font-size: 15px; letter-spacing: 1px; }
  .sumline { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .sumline b { font-variant-numeric: tabular-nums; }
  .hist { display: grid; gap: 8px; margin-bottom: 10px; }
  .hrow { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .hrow .h1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hrow .h2 { color: var(--muted-2); font-size: 13px; margin-top: 4px; line-height: 1.6; }
  .hrow .why { color: var(--rose); font-size: 13px; margin-top: 4px; }
  .hrow .acts { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
  .payform { background: #fff; border: 1px solid var(--line-2); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
  .payform label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted-2); }
  .payform label small { font-weight: 400; color: var(--muted); }
  .payform input { width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font-size: 16px; background: #fff; }
  .payform .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .payform .ferr { color: var(--rose); font-size: 13px; }
  #imgDlg img { display: block; max-width: 100%; max-height: calc(100vh - 140px); margin: 0 auto; }
  .btn { border: 1px solid var(--line-2); background: #fff; color: var(--text); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #F8FAFC; }
  .btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.pri:hover { background: var(--blue-d); }

  dialog { border: 0; border-radius: 18px; padding: 0; width: min(460px, calc(100vw - 16px)); max-height: calc(100vh - 16px); box-shadow: 0 24px 60px rgba(15,23,42,.35); }
  dialog::backdrop { background: rgba(15,23,42,.5); }
  .dh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dh b { font-size: 16px; }
  .dbody { padding: 12px; overflow: auto; max-height: calc(100vh - 150px); background: #F8FAFC; }
  .paper-wrap { display: flex; justify-content: center; padding: 6px 0; overflow: auto; }
  .dact { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); justify-content: flex-end; }

  .paper { --ln: #A9BEDD; --ac: #0F4FB8; width: 350px; background: #fff; color: #1E293B; border: 1.5px solid var(--ac); font-family: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; font-size: 14px; line-height: 1.35; }
  .paper .phd { display: flex; align-items: center; gap: 10px; padding: 10px 12px; height: 80px; box-sizing: border-box; background: #fff; color: #1E293B; border-bottom: 3px solid var(--ac); }
  .paper .phd .lg { width: 56px; height: 60px; background: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .paper .phd .lg img { width: 56px; height: 60px; object-fit: contain; display: block; }
  .paper .phd .tt { flex: 1; text-align: center; }
  .paper .phd .tt b { display: block; font-size: 36px; letter-spacing: 3px; line-height: 1; white-space: nowrap; }
  .paper .ph2 { display: flex; justify-content: center; gap: 22px; font-size: 19px; font-weight: 700; padding: 8px; border-bottom: 1px solid var(--ln); }
  .paper .ph3 { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; font-size: 14px; border-bottom: 1px solid var(--ln); }
  .paper .ph3 small { font-size: 11px; font-weight: 700; }
  .paper .band { text-align: center; font-size: 17px; font-weight: 700; letter-spacing: 3px; padding: 4px 0; color: #1E293B; border-top: 2px solid var(--ac); border-bottom: 2px solid var(--ac); }
  .paper .pr { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--ln); min-height: 44px; }
  .paper .pl { padding: 4px 10px; font-size: 16px; display: flex; flex-direction: column; justify-content: space-between; }
  .paper .pl small, .paper .pv small { font-size: 10.5px; color: #475569; }
  .paper .pv { padding: 4px 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
  .paper .pv .amt { font-size: 18px; font-variant-numeric: tabular-nums; }
  .paper .tot { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--ln); align-items: center; min-height: 40px; }
  .paper .tot .pl { font-size: 17px; font-weight: 700; }
  .paper .tot .pv { font-size: 20px; font-weight: 700; align-items: center; justify-content: center; color: var(--ac); }
  .paper .foot { padding: 6px 10px; font-size: 11.5px; border-bottom: 1px solid var(--ln); }
  .paper .foot b { font-weight: 700; }
  .paper .nt { padding: 6px 10px 18px; font-size: 12px; min-height: 52px; white-space: pre-wrap; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #0F172A; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); }
  #toast.bad { background: var(--rose); }
  .busy { position: fixed; inset: 0; background: rgba(255,255,255,.6); display: flex; align-items: center; justify-content: center; font-weight: 700; z-index: 40; }
  .test-tag { position: fixed; left: 8px; bottom: 6px; font-size: 11px; color: var(--muted); opacity: .8; pointer-events: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea .paper { --ln: #000; --ac: #000; border: 1.5px solid #000; color: #000; margin: 0 auto; }
    #printArea .paper .phd, #printArea .paper .band, #printArea .paper .tot { border-color: #000; }
    #printArea .paper .tot .pv { color: #000; }
  }
</style>
</head>

<header class="hero">
  <div class="hero-inner">
    <div class="topbar">
      <a class="brand" href="../" aria-label="回學務雲首頁">

        <span><span class="brand-name">基翔學務雲</span><br><span class="brand-sub">JX EduCloud</span></span>
      </a>
      <a class="back" href="../">回首頁</a>
    </div>
    <div class="greet">
      <h1>學費單</h1>

    </div>

<main>
  <section class="panel hidden" id="pickPanel" aria-labelledby="pickTitle">
    <h2 id="pickTitle">選擇要檢視的學生</h2>
    <div class="pickbar">

  <section class="panel" id="billPanel" aria-labelledby="listTitle">

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dh"><b id="dlgTitle">學費單</b><button type="button" class="btn" id="dlgClose">關閉</button></div>
  <div class="dbody"><div class="paper-wrap" id="paperBox"></div><div class="paysec" id="paySec"></div></div>
  <div class="dact">
    <button type="button" class="btn" id="bPrint">列印</button>
    <button type="button" class="btn" id="bDown">下載圖片</button>

<script>
const SUPABASE_URL = "https://jflnvliefjfxhfwjzqdi.supabase.co";      // 測試專案
const SUPABASE_KEY = "sb_publishable_ZVT08ujYz6NmsowKmqBNng_JxBJaVmb";
const PORTAL_URL = "../";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storage: window.sessionStorage, storageKey: "jx-auth" }
});
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n < 0 ? "-" : "") + Math.abs(Number(n) || 0).toLocaleString("en-US");

let BILLS = [], ACCOUNTS = [], PAYS = [], current = null;
let SID = null, VIEW_ONLY = false, editPayId = null;

/* ---------- 共用 ---------- */
function busy(on) {
  const el = $("busy");
  el.classList.toggle("hidden", !on);
  try { if (on) { if (!el.matches(":popover-open")) el.showPopover(); } else if (el.matches(":popover-open")) el.hidePopover(); } catch (_) { /* 舊瀏覽器 */ }
}
let toastTimer;
function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.className = bad ? "bad" : "";
  try { if (!t.matches(":popover-open")) t.showPopover(); } catch (_) { /* 舊瀏覽器 */ }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.add("hidden"); try { if (t.matches(":popover-open")) t.hidePopover(); } catch (_) {} }, 3200);
}
async function goPortal(msg) {
  try { await sb.auth.signOut({ scope: "local" }); } catch (_) { /* 忽略 */ }
  ["authToken", "isTeacherLoggedIn", "loggedInStudentId", "lastActivityTime", "jx-me"].forEach(k => { try { sessionStorage.removeItem(k); } catch (_) {} });
  try { sessionStorage.setItem("jx-notice", msg || ""); } catch (_) { /* 忽略 */ }
  location.replace(PORTAL_URL);
}

/* ---------- 閒置 60 分鐘自動登出 ---------- */
const IDLE_MS = 60 * 60 * 1000;
function touch() { try { sessionStorage.setItem("lastActivityTime", String(Date.now())); } catch (_) {} }
let lastTouch = 0;
["mousedown", "keydown", "touchstart", "scroll"].forEach(ev => window.addEventListener(ev, () => {
  if (Date.now() - lastTouch > 15000) { lastTouch = Date.now(); touch(); }
}, { passive: true, capture: true }));
setInterval(() => {
  const last = parseInt(sessionStorage.getItem("lastActivityTime") || "0", 10);
  if (last && Date.now() - last > IDLE_MS) goPortal("閒置超過 60 分鐘，已自動登出");
}, 15000);

/* ---------- 工具 ---------- */
function fmtDue(d) { if (!d) return ""; const [, m, dd] = d.split("-"); return `${+m} 月 ${+dd} 日止`; }
const sortedItems = b => (b.fee_bill_items || []).slice().sort((a, c) => (a.sort_order || 0) - (c.sort_order || 0));
const isBlank = it => it.amount === 0 && it.counted && !it.period_text && !it.note;
const acctOf = id => ACCOUNTS.find(a => a.id === id);
function amtText(it) {
  if (!it.counted) return it.amount === 0 ? "已繳" : fmt(it.amount) + "（已繳）";
  return fmt(it.amount);
}
const todayTW = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const METHOD = { transfer: "匯款", cash: "現金", other: "其他" };
const paysOf = b => PAYS.filter(x => x.bill_id === b.id);
function payInfo(b) {
  const ps = paysOf(b);
  const pend = ps.filter(x => x.status === "pending");
  const paid = b.paid_total || 0, total = b.total || 0;
  const remain = Math.max(total - paid, 0);
  const pendSum = pend.reduce((a, x) => a + x.amount, 0);
  let key, text;
  if (total <= 0 || paid >= total) { key = "paid"; text = paid > total && total > 0 ? "已繳清（多繳 " + fmt(paid - total) + "）" : "已繳清"; }
  else if (pend.length) { key = "pending"; text = "待確認"; }
  else if (b.due_date && b.due_date < todayTW()) { key = "overdue"; text = paid > 0 ? "逾期・尚欠 " + fmt(remain) : "已逾期"; }
  else if (paid > 0) { key = "partial"; text = "部分繳・尚欠 " + fmt(remain); }
  else { key = "unpaid"; text = "未繳"; }
  return { key, text, paid, total, remain, pend, pendSum, ps };
}
const isNew = b => b.issued_at && (Date.now() - new Date(b.issued_at).getTime()) < 7 * 864e5;

/* ---------- 學費單（紙本樣式，與管理端相同） ---------- */
function paperHtml(b) {
  const acc = acctOf(b.account_id);
  const rows = sortedItems(b).filter(it => !isBlank(it)).map(it => `
    <div class="pr"><div class="pl">${esc(it.label)}<small>期間</small></div>
    <div class="pv"><span class="amt">${esc(amtText(it))}</span><small>${esc(it.period_text)}${it.note ? " " + esc(it.note) : ""}</small></div></div>`).join("");
  const foot = acc ? `${acc.report_note ? `<div>${esc(acc.report_note)}</div>` : ""}
      <div style="margin-top:4px"><b>匯款銀行 : ${esc(acc.bank_name)}${acc.bank_code ? " " + esc(acc.bank_code) : ""}</b></div>
      <div><b>匯款帳號 : ${esc(acc.account_no)}</b></div>` : `<div>（收款帳戶請洽班導師）</div>`;
  return `<div class="paper">
    <div class="phd"><div class="lg"><img src="../logo-full.jpg" alt=""></div><div class="tt"><b>基翔文理</b></div></div>
    <div class="ph2"><span>${esc(b.grade_text)}</span><span>${esc(b.student_name)}</span></div>
    <div class="ph3"><small>繳費期限</small><span>${esc(fmtDue(b.due_date))}</span><small>請勿逾期，謝謝。</small></div>
    <div class="band">${esc(b.title || "學費單")}</div>
    ${rows}
    <div class="tot"><div class="pl">總計</div><div class="pv">${fmt(b.total)}</div></div>
    <div class="foot">${foot}</div>
    <div class="nt">備註：${esc(b.note || "")}</div>
  </div>`;
}

/* ---------- 列表 ---------- */
function render() {
  const list = $("list");
  if (!BILLS.length) {
    list.innerHTML = `<div class="empty">目前沒有學費單。<br>班上開立並發布後，會顯示在這裡。</div>`;
    $("help").textContent = "";
    return;
  }
  list.innerHTML = BILLS.map((b, i) => {
    const pi = payInfo(b);
    const chips = sortedItems(b).filter(it => it.counted && it.amount !== 0)
      .map(it => `<span class="chip${it.amount < 0 ? " neg" : ""}">${esc(it.label)}</span>`).join("");
    return `<button type="button" class="bill" data-i="${i}" aria-label="${esc(b.title || "學費單")}，應繳 ${fmt(b.total)} 元，點一下查看明細">
      <div class="r1"><span class="ttl">${esc(b.title || "學費單")}${isNew(b) ? '<span class="new">新</span>' : ""}</span><span class="amt">${fmt(b.total)} 元</span></div>
      <div class="r2">${b.due_date ? `<span>繳費期限 ${esc(fmtDue(b.due_date))}</span>` : ""}<span class="st ${pi.key}">${esc(pi.text)}</span>${pi.key === "pending" ? `<span>已回報 ${fmt(pi.pendSum)} 元，等班上確認</span>` : ""}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ""}
    </button>`;
  }).join("");
  $("help").textContent = "點選任一張可查看完整明細、匯款資訊與繳款紀錄；匯款後可在明細裡「回報已繳款」。如有疑問請洽班導師。";
}
$("list").addEventListener("click", e => {
  const el = e.target.closest(".bill");
  if (el) openBill(BILLS[+el.dataset.i]);
});

/* ---------- 明細 ---------- */
function openBill(b) {
  current = b;
  $("dlgTitle").textContent = b.title || "學費單";
  $("paperBox").innerHTML = paperHtml(b);
  editPayId = null;
  renderPay();
  if (!$("dlg").open) $("dlg").showModal();
}
$("dlgClose").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

const blobOf = c => new Promise(r => c.toBlob(r, "image/png"));
const fileName = b => `${b.student_name}_${b.title || "學費單"}.png`.replace(/[\\/:*?"<>|]/g, "_");
async function imgAct(kind) {
  if (!current) return;
  busy(true);
  try {
    const canvas = await html2canvas($("paperBox").querySelector(".paper"), { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    const blob = await blobOf(canvas);
    const name = fileName(current);
    if (kind === "down") {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    } else {
      const file = new File([blob], name, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("這個裝置不支援直接傳送，已改為下載圖片"); }
    }
  } catch (ex) {
    if (ex && ex.name === "AbortError") return;
    toast((ex && ex.message) || "操作失敗", true);
  } finally { busy(false); }
}
$("bDown").addEventListener("click", () => imgAct("down"));
$("bShare").addEventListener("click", () => imgAct("share"));
$("bPrint").addEventListener("click", () => {
  if (!current) return;
  $("printArea").innerHTML = paperHtml(current);
  setTimeout(() => window.print(), 60);
});

/* ---------- 繳款紀錄與回報 ---------- */
function histRow(x) {
  const stName = { pending: "待確認", confirmed: "已確認", rejected: "已退回" }[x.status];
  const stCls = { pending: "pending", confirmed: "paid", rejected: "rejected" }[x.status];
  const via = x.source === "staff" ? `班上登記（${METHOD[x.method] || "其他"}）` : "家長回報";
  const meta = [`${fmtDate(x.paid_date)}`, via, x.last5 ? `末五碼 ${esc(x.last5)}` : ""].filter(Boolean).join("・");
  const canEdit = !VIEW_ONLY && x.status === "rejected" && x.source === "parent";
  return `<div class="hrow">
    <div class="h1"><b>${fmt(x.amount)} 元</b><span class="st ${stCls}">${stName}</span></div>
    <div class="h2">${meta}${x.parent_note ? `<br>備註：${esc(x.parent_note)}` : ""}</div>
    ${x.status === "rejected" && x.admin_note ? `<div class="why">退回原因：${esc(x.admin_note)}</div>` : ""}
    ${x.status === "confirmed" && x.admin_note ? `<div class="h2">班上備註：${esc(x.admin_note)}</div>` : ""}
    <div class="acts">${x.screenshot_path ? `<button type="button" class="btn sm" data-shot="${esc(x.screenshot_path)}">查看截圖</button>` : ""}${canEdit ? `<button type="button" class="btn sm pri" data-edit="${esc(x.id)}">修改後重送</button>` : ""}</div>
  </div>`;
}
function renderPay() {
  const b = current; if (!b) return;
  const pi = payInfo(b);
  const hist = pi.ps.slice().sort((a, c) => String(c.reported_at).localeCompare(String(a.reported_at)));
  const canReport = !VIEW_ONLY && pi.key !== "paid";
  const ed = editPayId ? PAYS.find(x => x.id === editPayId) : null;
  $("paySec").innerHTML = `
    <h3>繳款狀態 <span class="st ${pi.key}">${esc(pi.text)}</span></h3>
    <div class="sumline"><span>應繳 <b>${fmt(pi.total)}</b></span><span>已確認 <b>${fmt(pi.paid)}</b></span><span>尚欠 <b>${fmt(pi.remain)}</b></span>${pi.pendSum ? `<span>待確認 <b>${fmt(pi.pendSum)}</b></span>` : ""}</div>
    ${hist.length ? `<div class="hist">${hist.map(histRow).join("")}</div>` : `<p class="help" style="margin:0 0 8px">還沒有繳款紀錄。</p>`}
    ${canReport ? (ed || $("paySec").dataset.open === b.id ? formHtml(b, pi, ed) : `<button type="button" class="btn pri" id="openForm" style="width:100%">回報已繳款</button>`) : ""}
    ${VIEW_ONLY ? `<p class="help" style="margin:0">管理員檢視模式：不能回報，只能查看。</p>` : ""}`;
}
function formHtml(b, pi, ed) {
  const amt = ed ? ed.amount : (pi.remain || b.total);
  return `<form class="payform" id="payForm" novalidate>
    <b>${ed ? "修改後重送" : "回報已繳款"}</b>
    <div class="row2">
      <label>匯款日期<input type="date" id="pfDate" required value="${esc(ed ? ed.paid_date : todayTW())}" max="${todayTW()}"></label>
      <label>匯款金額（元）<input type="number" id="pfAmt" required min="1" step="1" inputmode="numeric" value="${esc(amt)}"></label>
    </div>
    <label>匯款帳號末五碼<small>匯款明細上可以查到，班上用來對帳（必填）</small><input type="text" id="pfLast5" required maxlength="5" inputmode="numeric" pattern="[0-9]{5}" autocomplete="off" value="${esc(ed ? ed.last5 : "")}" placeholder="例如 12345"></label>
    <label>匯款截圖（選填）<small>有的話對帳更快</small><input type="file" id="pfFile" accept="image/*"></label>
    <label>備註（選填）<input type="text" id="pfNote" maxlength="100" value="${esc(ed ? ed.parent_note : "")}"></label>
    <div class="ferr hidden" id="pfErr" role="alert"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="pfCancel">取消</button><button type="submit" class="btn pri" id="pfSubmit">送出回報</button></div>
  </form>`;
}
const fmtDate = d => d ? String(d).replace(/-/g, "/") : "";
$("paySec").addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "openForm") { $("paySec").dataset.open = current.id; renderPay(); const f = $("pfLast5"); if (f) f.scrollIntoView({ block: "center" }); return; }
  if (t.id === "pfCancel") { editPayId = null; delete $("paySec").dataset.open; renderPay(); return; }
  if (t.dataset.edit) { editPayId = t.dataset.edit; renderPay(); const f = $("pfLast5"); if (f) f.scrollIntoView({ block: "center" }); return; }
  if (t.dataset.shot) { showShot(t.dataset.shot); }
});
$("paySec").addEventListener("submit", e => { e.preventDefault(); submitPay(); });

async function showShot(path) {
  $("imgBox").className = "empty"; $("imgBox").textContent = "讀取中…";
  $("imgDlg").showModal();
  try {
    const { data, error } = await sb.storage.from("fee-proofs").createSignedUrl(path, 300);
    if (error) throw error;
    $("imgBox").className = ""; $("imgBox").innerHTML = `<img src="${esc(data.signedUrl)}" alt="匯款截圖">`;
  } catch (ex) { $("imgBox").textContent = "無法讀取截圖：" + ((ex && ex.message) || ""); }
}
$("imgClose").addEventListener("click", () => $("imgDlg").close());

// 截圖縮小再上傳（長邊 1600px、JPEG），省流量也避免超過 5MB
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("圖片處理失敗")), "image/jpeg", 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("無法讀取這張圖片，請換一張或不附截圖")); };
    img.src = url;
  });
}
function payErr(msg) { const e = $("pfErr"); e.textContent = msg; e.classList.toggle("hidden", !msg); }
function friendlyPay(m) {
  if (/last5 required/.test(m)) return "請輸入 5 碼數字的匯款帳號末五碼";
  if (/invalid amount/.test(m)) return "金額要大於 0";
  if (/invalid date/.test(m)) return "匯款日期不正確（不能是未來，也不能超過一年前）";
  if (/too many pending/.test(m)) return "已經有 5 筆待確認，請等班上確認後再回報";
  if (/bill not found/.test(m)) return "找不到這張學費單，請重新整理";
  if (/payment not editable/.test(m)) return "這筆已經不能修改，請重新整理";
  if (/invalid screenshot|Payload too large|exceeded/.test(m)) return "截圖上傳失敗，請換一張或不附截圖";
  if (/Failed to fetch|NetworkError/i.test(m)) return "無法連線，請檢查網路後再試一次";
  if (/JWT|not authenticated|42501|students only/.test(m)) return "登入已過期或沒有權限，請重新登入";
  return "送出失敗：" + m;
}
let submitting = false;
async function submitPay() {
  if (submitting || VIEW_ONLY || !current) return;
  const date = $("pfDate").value, amount = parseInt($("pfAmt").value, 10), last5 = $("pfLast5").value.trim();
  if (!date) return payErr("請選擇匯款日期");
  if (date > todayTW()) return payErr("匯款日期不能是未來");
  if (!(amount > 0)) return payErr("請輸入匯款金額");
  if (!/^[0-9]{5}$/.test(last5)) return payErr("請輸入 5 碼數字的匯款帳號末五碼");
  payErr("");
  submitting = true; $("pfSubmit").disabled = true; busy(true);
  try {
    let path = null;
    const f = $("pfFile").files[0];
    if (f) {
      const blob = await shrinkImage(f);
      path = `${SID}/${current.id}_${Date.now()}.jpg`;
      const up = await sb.storage.from("fee-proofs").upload(path, blob, { contentType: "image/jpeg", upsert: false });
      if (up.error) throw up.error;
    }
    const { error } = await sb.rpc("fee_report_payment", { p: { id: editPayId || undefined, bill_id: current.id, amount, paid_date: date, last5, note: $("pfNote").value.trim(), screenshot_path: path } });
    if (error) throw error;
    editPayId = null; delete $("paySec").dataset.open;
    await loadData();
    const again = BILLS.find(x => x.id === current.id);
    if (again) { current = again; renderPay(); }
    toast("已送出回報，等班上確認後會更新狀態");
  } catch (ex) {
    payErr(friendlyPay((ex && ex.message) || String(ex || "")));
  } finally { submitting = false; busy(false); const b = $("pfSubmit"); if (b) b.disabled = false; }
}

/* ---------- 管理員：選學生（低年級到高年級由上而下，可依年級篩選） ---------- */
const GRADE_LIST = ["大班", "一年級", "二年級", "三年級", "四年級", "五年級", "六年級", "國一", "國二", "國三", "高一", "高二", "高三"];
const gradeNo = g => { const i = GRADE_LIST.indexOf(g); return i < 0 ? 99 : i; };
const zh = (a, b) => String(a || "").localeCompare(String(b || ""), "zh-Hant");
const cmpStu = (a, b) => gradeNo(a.grade) - gradeNo(b.grade) || zh(a.school, b.school) || zh(a.name, b.name);
function showPicker(all) {
  const rows = all.filter(s => s.active !== false);
  const gs = GRADE_LIST.filter(g => rows.some(s => s.grade === g));
  if (rows.some(s => gradeNo(s.grade) === 99)) gs.push("其他");
  $("pickG").innerHTML = '<option value="">全部年級</option>' + gs.map(g => `<option>${esc(g)}</option>`).join("");
  $("who").textContent = "管理員檢視家長端";
  $("billPanel").classList.add("hidden");
  $("pickPanel").classList.remove("hidden");
  const draw = () => {
    const q = $("pickQ").value.trim().toLowerCase();
    const g = $("pickG").value;
    const hit = rows.filter(s => (!g || (g === "其他" ? gradeNo(s.grade) === 99 : s.grade === g)) && (!q || `${s.name} ${s.account_code} ${s.grade} ${s.school}`.toLowerCase().includes(q)));
    $("pickList").innerHTML = hit.length
      ? hit.map(s => `<a href="?sid=${encodeURIComponent(s.id)}"><span>${esc(s.name)}</span><small>${esc([s.grade, s.account_code].filter(Boolean).join("・"))}</small></a>`).join("")
      : '<div class="empty">找不到符合的學生</div>';
  };
  $("pickQ").addEventListener("input", draw);
  $("pickG").addEventListener("change", draw);
  draw();
}

/* ---------- 啟動 ---------- */
function showError(msg) { const e = $("err"); e.textContent = msg; e.classList.remove("hidden"); }
// 家長：後端只會回傳「已發布」且屬於本人的學費單與繳款。管理員：另外限定該學生與已發布，畫面與家長一致
async function loadData() {
  const [b, a, y] = await Promise.all([
    sb.from("fee_bills").select("*, fee_bill_items(*)").eq("status", "issued").eq("student_id", SID).order("issued_at", { ascending: false, nullsFirst: false }),
    sb.from("fee_accounts").select("*"),
    sb.from("fee_payments").select("*").eq("student_id", SID).order("reported_at", { ascending: false })
  ]);
  if (b.error) throw b.error;
  BILLS = b.data || [];
  ACCOUNTS = a.data || [];
  PAYS = y.error ? [] : (y.data || []);
  render();
}
async function start() {
  busy(true);
  try {
    const { data: s } = await sb.auth.getSession();
    if (!s || !s.session) return goPortal("登入已過期，請重新登入");
    const p = await sb.from("profiles").select("role,student_id").eq("id", s.session.user.id).maybeSingle();
    if (p.error || !p.data) return goPortal("登入已過期，請重新登入");
    const role = p.data.role;
    if (role !== "student" && role !== "admin") { location.replace(PORTAL_URL); return; }   // 老師請從學費管理進入
    touch();
    let sid = p.data.student_id;
    VIEW_ONLY = role === "admin";
    if (role === "admin") {
      // 管理員檢視：選一位學生（?sid=），看到的和家長一樣
      const want = new URLSearchParams(location.search).get("sid") || "";
      const r = await sb.rpc("admin_list_students");
      if (r.error) throw r.error;
      const all = (r.data || []).slice().sort(cmpStu);
      const st = all.find(x => x.id === want);
      if (!st) { showPicker(all); return; }
      sid = st.id;
      $("who").textContent = [st.name, st.grade, st.account_code].filter(Boolean).join("・");
      $("adminWho").textContent = st.name;
      $("adminBar").classList.remove("hidden");
      $("listTitle").textContent = `${st.name} 的學費單`;
    } else {
      const st = await sb.from("students").select("name,grade,school,account_code").eq("id", sid).maybeSingle();
      if (st.data) $("who").textContent = [st.data.name, st.data.grade, st.data.account_code].filter(Boolean).join("・");
    }
    SID = sid;
    await loadData();
  } catch (ex) {
    const m = (ex && ex.message) || String(ex || "");
    if (/JWT|not authenticated|42501|permission/i.test(m)) return goPortal("登入已過期，請重新登入");
    showError(/Failed to fetch|NetworkError/i.test(m) ? "無法連線，請檢查網路後再試一次" : "讀取失敗：" + m);
  } finally { busy(false); }
}
start();
