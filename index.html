<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基翔學務雲｜基翔文理補習班</title>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #F1F5F9; --card: #FFFFFF; --line: #E2E8F0; --line-2: #CBD5E1;
    --text: #1E293B; --muted: #64748B; --muted-2: #475569;
    --blue: #1660D6; --blue-d: #0F4FB8; --blue-l: #DBEAFE; --navy: #0F3A80;
    --gold: #F5B301; --gold-l: #FEF3C7; --gold-d: #92400E;
    --green: #047857; --green-l: #D1FAE5; --rose: #BE123C; --rose-l: #FFE4E6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif; min-height: 100vh; }
  button, input, select { font: inherit; }
  .hidden { display: none !important; }
  a { color: var(--blue); }

  .hero { background: linear-gradient(90deg, #0F4FB8, #1D8CF0); color: #fff; padding: 0 20px; }
  .hero-inner { max-width: 1120px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: #fff; flex: 0 0 44px; overflow: hidden; box-shadow: 0 2px 8px rgba(15,23,42,.18); }
  .logo img { width: 100%; height: 100%; display: block; }
  .brand-name { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  .brand-sub { font-size: 11px; color: #DBEAFE; letter-spacing: .5px; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--gold); color: var(--text); }
  .ghost-btn { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: rgba(255,255,255,.18); color: #fff; cursor: pointer; font-size: 14px; }
  .ghost-btn:hover { background: rgba(255,255,255,.28); }

  /* 登入 */
  #loginView { min-height: 100vh; position: relative; overflow: hidden; background: #EEF2F7; }
  .sky { position: absolute; inset: 0 0 auto 0; height: 470px; background: linear-gradient(115deg, #0B4FC4 0%, #1366DD 45%, #2D8EF0 100%); overflow: hidden; }
  .sky .swoosh { position: absolute; left: -40px; top: 90px; width: 560px; height: 120px; opacity: .35; }
  .sky .clouds { position: absolute; left: 0; right: 0; bottom: -2px; width: 100%; height: 190px; display: block; }
  .login-wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 56px 20px 40px; }
  .brandbar { display: flex; align-items: center; justify-content: center; gap: 22px; color: #fff; }
  .brand-tile { width: 104px; height: 104px; flex: 0 0 104px; border-radius: 24px; background: #fff; box-shadow: 0 10px 28px rgba(8,40,110,.35); overflow: hidden; }
  .brand-tile img { width: 100%; height: 100%; display: block; }
  .brand-title { margin: 0; font-size: 44px; font-weight: 700; letter-spacing: 6px; line-height: 1.15; }
  .brand-en { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 18px; letter-spacing: 3px; color: #EAF2FF; }
  .brand-en::before, .brand-en::after { content: ""; flex: 1 1 28px; min-width: 22px; height: 2px; background: #F5B301; border-radius: 2px; }
  .tagline { margin: 22px 0 0; text-align: center; color: #EAF2FF; font-size: 16px; letter-spacing: 1px; }
  .login-card { margin: 28px auto 0; background: var(--card); border-radius: 18px; padding: 26px 24px 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 18px 40px rgba(15,23,42,.14), 0 2px 6px rgba(15,23,42,.06); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 14px; background: #EEF2F7; }
  .seg button { min-height: 48px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: #475569; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .seg button svg { flex: 0 0 auto; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--blue-d); font-weight: 700; border-color: #DCE6F5; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
  .fields { display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500; color: #334155; }
  .ctl { display: flex; align-items: center; min-height: 52px; border: 1px solid #D5DEEA; border-radius: 12px; background: #fff; padding: 0 6px 0 14px; transition: border-color .15s, box-shadow .15s; }
  .ctl:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(22,96,214,.15); }
  .ctl .ico { flex: 0 0 auto; color: #64748B; display: flex; }
  .ctl .sep { width: 1px; height: 22px; background: #D5DEEA; margin: 0 12px; flex: 0 0 1px; }
  .ctl input, .ctl select { flex: 1 1 auto; min-width: 0; height: 48px; border: 0; outline: none; background: transparent; font-size: 16px; color: var(--text); }
  .ctl select { cursor: pointer; padding-right: 8px; }
  .eye { flex: 0 0 auto; width: 40px; height: 40px; border: 0; background: transparent; color: #64748B; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .eye:hover { background: #F1F5F9; }
  #acctInput { text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }
  #acctInput::placeholder { text-transform: none; letter-spacing: .5px; color: #94A3B8; }
  #staffAcctInput { letter-spacing: .5px; font-weight: 500; }
  #staffAcctInput::placeholder { color: #94A3B8; font-weight: 400; }
  .remember { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #334155; cursor: pointer; user-select: none; min-height: 32px; align-self: flex-start; }
  .remember input { width: 18px; height: 18px; margin: 0; accent-color: var(--blue); cursor: pointer; }
  #pinInput, #staffPwdInput { letter-spacing: 4px; }
  #pinInput::placeholder, #staffPwdInput::placeholder { letter-spacing: 1px; color: #94A3B8; }
  .hint { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
  .hint svg { flex: 0 0 auto; margin-top: 3px; color: var(--blue); }
  .notice { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: #1E40AF; background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 10px; padding: 10px 12px; margin: 0; line-height: 1.6; }
  .notice svg { flex: 0 0 auto; margin-top: 3px; }
  .error { font-size: 14px; color: var(--rose); background: var(--rose-l); border-radius: 10px; padding: 10px 12px; margin: 0; }
  .primary { min-height: 54px; border: 0; border-radius: 12px; background: linear-gradient(90deg, #0F56CF, #1D8CF0); color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 18px rgba(22,96,214,.28); }
  .primary:hover { filter: brightness(1.06); }
  .primary:disabled { opacity: .6; cursor: wait; }
  .foot { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 22px 0 0; }
  .foot svg { color: var(--blue); }
  @media (max-width: 520px) {
    .sky { height: 400px; }
    .login-wrap { padding-top: 40px; }
    .brandbar { gap: 14px; }
    .brand-tile { width: 76px; height: 76px; flex-basis: 76px; border-radius: 18px; }
    .brand-title { font-size: 32px; letter-spacing: 4px; }
    .brand-en { font-size: 14px; letter-spacing: 2px; gap: 8px; }
    .brand-en::before, .brand-en::after { min-width: 14px; }
    .tagline { font-size: 15px; margin-top: 18px; }
    .login-card { padding: 22px 18px 20px; }
    .seg button { font-size: 14px; gap: 6px; }
  }

  /* 入口 */
  #portalView .hero { padding-bottom: 110px; }
  .greet { padding: 18px 0 0; }
  .greet h1 { margin: 0; font-size: 30px; }
  .greet p { margin: 8px 0 0; color: #EAF2FF; font-size: 15px; }
  .portal-main { max-width: 1120px; margin: -80px auto 0; padding: 0 20px 80px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .card { display: flex; flex-direction: column; gap: 14px; padding: 24px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--text); }
  a.card:hover { border-color: var(--blue); }
  .card.off { opacity: .75; }
  .card-icon { width: 54px; height: 54px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
  .card-title { font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-en { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card-desc { font-size: 15px; color: var(--muted-2); line-height: 1.6; margin: 0; }
  .card-note { font-size: 12px; color: var(--muted); margin: 0; }
  .card-cta { margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 12px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 700; }
  .card.off .card-cta { background: var(--line); color: var(--muted-2); }
  .tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted-2); }

  .test-tag { position: fixed; left: 8px; bottom: 8px; z-index: 99; background: #7c3aed; color: #fff; font: 700 11px/1 sans-serif; padding: 6px 10px; border-radius: 999px; opacity: .9; pointer-events: none; }
  .busy { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: flex; align-items: center; justify-content: center; z-index: 100; color: #fff; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>

<!-- ==================== 登入 ==================== -->
<section id="loginView" class="hidden" aria-labelledby="loginTitle">
  <div class="sky" aria-hidden="true">
    <svg class="swoosh" viewBox="0 0 560 120" fill="none"><path d="M0 100 C 140 30, 300 20, 560 40" stroke="#fff" stroke-width="1.5"/><circle cx="470" cy="34" r="3" fill="#fff"/><circle cx="492" cy="36" r="2.5" fill="#fff"/></svg>
    <svg class="clouds" viewBox="0 0 1440 190" preserveAspectRatio="none">
      <path fill="#DCE9FA" fill-opacity=".85" d="M0 120 C 40 60, 120 50, 170 90 C 200 40, 290 40, 320 100 C 360 80, 420 100, 430 140 L 430 190 L 0 190 Z"/>
      <path fill="#FFFFFF" fill-opacity=".55" d="M1040 150 C 1080 110, 1150 110, 1180 140 C 1210 100, 1290 95, 1320 130 C 1360 100, 1430 110, 1440 130 L 1440 190 L 1030 190 Z"/>
      <rect x="0" y="150" width="1440" height="40" fill="#EEF2F7"/>
    </svg>
  </div>

  <div class="login-wrap">
    <div class="brandbar">
      <div class="brand-tile"><img src="logo.png" alt="基翔 logo"></div>
      <div>
        <h1 id="loginTitle" class="brand-title">基翔學務雲</h1>
        <div class="brand-en">JX EduCloud</div>
      </div>
    </div>
    <p class="tagline">一個帳號，掌握孩子學習大小事</p>

    <form class="login-card" id="loginForm" novalidate>
      <div class="seg" role="group" aria-label="登入身分">
        <button type="button" id="tabFamily" aria-pressed="true">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.6"/><path d="M2.5 19.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6v.5h-13z"/><circle cx="17" cy="9" r="2.8"/><path d="M16 13.6c3.1-.2 5.5 1.9 5.5 5.1v.8h-4.4c0-2.3-.4-4.3-1.1-5.9z"/></svg>
          學生・家長</button>
        <button type="button" id="tabStaff" aria-pressed="false">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.6"/><path d="M2.5 20c0-3.6 2.9-6.3 6.5-6.3s6.5 2.7 6.5 6.3"/><path d="M16.2 4.6a3.6 3.6 0 010 7M18.5 14.2c1.8.9 3 2.9 3 5.8"/></svg>
          老師・管理者</button>
      </div>

      <div id="familyFields" class="fields">
        <label class="field" for="acctInput">學生帳號
          <span class="ctl">
            <span class="ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c0-4 3.4-6.7 7.5-6.7s7.5 2.7 7.5 6.7"/></svg></span>
            <span class="sep" aria-hidden="true"></span>
            <input id="acctInput" type="text" maxlength="8" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="例如 JX115001">
          </span>
        </label>
        <label class="field" for="pinInput">4 位數密碼
          <span class="ctl">
            <span class="ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/><path d="M12 14.5v2.5"/></svg></span>
            <span class="sep" aria-hidden="true"></span>
            <input id="pinInput" type="password" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="••••">
            <button type="button" class="eye" data-eye="pinInput" aria-label="顯示密碼" aria-pressed="false"></button>
          </span>
        </label>
        <label class="remember"><input type="checkbox" id="rememberFamily">記住帳號（密碼每次都要輸入）</label>
        <p class="hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.5"/></svg>學生帳號由補習班提供，忘記帳號或密碼請洽櫃台</p>
      </div>

      <div id="staffFields" class="fields hidden">
        <label class="field" for="staffAcctInput">登入帳號
          <span class="ctl">
            <span class="ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c0-4 3.4-6.7 7.5-6.7s7.5 2.7 7.5 6.7"/></svg></span>
            <span class="sep" aria-hidden="true"></span>
            <input id="staffAcctInput" type="text" maxlength="62" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="例如 t_account">
          </span>
        </label>
        <label class="field" for="staffPwdInput">密碼
          <span class="ctl">
            <span class="ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/><path d="M12 14.5v2.5"/></svg></span>
            <span class="sep" aria-hidden="true"></span>
            <input id="staffPwdInput" type="password" autocomplete="off" placeholder="請輸入密碼">
            <button type="button" class="eye" data-eye="staffPwdInput" aria-label="顯示密碼" aria-pressed="false"></button>
          </span>
        </label>
        <label class="remember"><input type="checkbox" id="rememberStaff">記住帳號（密碼每次都要輸入）</label>
        <p class="hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.5"/></svg>老師帳號以 t_ 開頭，由管理員建立；忘記帳號或密碼請洽管理員</p>
      </div>

      <p id="loginNotice" class="notice hidden" role="status"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.5"/></svg><span id="loginNoticeText"></span></p>
      <p id="loginError" class="error hidden" role="alert"></p>
      <button type="submit" class="primary" id="loginBtn">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4"/><path d="M10 16l4-4-4-4"/><path d="M14 12H4"/></svg>
        登入</button>
    </form>
    <p class="foot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>閒置超過 60 分鐘會自動登出</p>
  </div>
</section>

<!-- ==================== 入口 ==================== -->
<section id="portalView" class="hidden">
  <div class="hero">
    <div class="hero-inner">
      <div class="topbar">
        <div class="brand">
          <div class="logo"><img src="logo.png" alt="基翔 logo"></div>
          <div>
            <div class="brand-name">基翔學務雲</div>
            <div class="brand-sub">JX EduCloud</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="chip" id="roleChip"></span>
          <button type="button" class="ghost-btn" id="logoutBtn">登出</button>
        </div>
      </div>
      <div class="greet">
        <h1 id="greetTitle"></h1>
        <p id="greetSub"></p>
      </div>
    </div>
  </div>
  <main class="portal-main">
    <div class="cards" id="cards"></div>
  </main>
</section>

<div id="busy" class="busy hidden" role="status">處理中，請稍候…</div>
<div class="test-tag">學務雲 測試版・整合版</div>

<script>
/* ==================== 設定 ==================== */
const SUPABASE_URL = "https://jflnvliefjfxhfwjzqdi.supabase.co";      // 測試專案
const SUPABASE_KEY = "sb_publishable_ZVT08ujYz6NmsowKmqBNng_JxBJaVmb";
const EMAIL_DOMAIN = "@school.test";
const LEARNING_URL = "https://mcdull60555.github.io/jixiang2017-test/";          // 學習通（測試版）
const ROLLCALL_URL = "https://mcdull60555.github.io/jixiang2017-test/rollcall/"; // 雲點名（測試版）

// 和學習通共用同一份登入狀態（同網域、同分頁的 sessionStorage），點進學習通不用再登入一次
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storage: window.sessionStorage, storageKey: "jx-auth" }
});
const sbAnon = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "jx-anon" }
});

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let mode = "family";

/* ==================== 畫面切換 ==================== */
function setMode(m) {
  mode = m;
  $("tabFamily").setAttribute("aria-pressed", m === "family");
  $("tabStaff").setAttribute("aria-pressed", m === "staff");
  $("familyFields").classList.toggle("hidden", m !== "family");
  $("staffFields").classList.toggle("hidden", m !== "staff");
  hideError();
}
function showError(msg) { $("loginError").textContent = msg; $("loginError").classList.remove("hidden"); }
function hideError() { $("loginError").classList.add("hidden"); }
// 從雲點名、學習通登出回來時，顯示原因（例如閒置自動登出）
function showNotice() {
  let msg = "";
  try { msg = sessionStorage.getItem("jx-notice") || ""; sessionStorage.removeItem("jx-notice"); } catch (_) { /* 忽略 */ }
  $("loginNoticeText").textContent = msg ? msg.replace(/\s+/g, " ") : "已登出";
  $("loginNotice").classList.toggle("hidden", false);
}
function hideNotice() { $("loginNotice").classList.add("hidden"); }
function busy(on) { $("busy").classList.toggle("hidden", !on); $("loginBtn").disabled = !!on; }

/* 記住帳號：只存在這台裝置的瀏覽器（localStorage），密碼一律不存 */
const REMEMBER_KEY = "jx-remember";
function readRemember() {
  try { return JSON.parse(localStorage.getItem(REMEMBER_KEY) || "{}") || {}; } catch (_) { return {}; }
}
function writeRemember(r) {
  try {
    if (r.family || r.staff) localStorage.setItem(REMEMBER_KEY, JSON.stringify(r));
    else localStorage.removeItem(REMEMBER_KEY);
  } catch (_) { /* 無痕模式等情況存不了，忽略 */ }
}
function fillRemembered() {
  const r = readRemember();
  $("acctInput").value = r.family || "";
  $("rememberFamily").checked = !!r.family;
  $("staffAcctInput").value = r.staff || "";
  $("rememberStaff").checked = !!r.staff;
  setMode(r.mode === "staff" ? "staff" : "family");
  const acct = mode === "staff" ? $("staffAcctInput") : $("acctInput");
  const pwd = mode === "staff" ? $("staffPwdInput") : $("pinInput");
  (acct.value ? pwd : acct).focus({ preventScroll: true });
}
function saveRemember(acct) {
  const r = readRemember();
  const on = mode === "staff" ? $("rememberStaff").checked : $("rememberFamily").checked;
  r[mode] = on ? acct : "";
  r.mode = mode;
  writeRemember(r);
}
// 老師帳號：轉小寫、沒打 t_ 自動補上（admin 例外）
function normStaffAcct(v) {
  let u = String(v || "").trim().toLowerCase();
  if (!u) return "";
  if (u !== "admin" && u.indexOf("t_") !== 0) u = "t_" + u;
  return u;
}

/* ==================== 登入 ==================== */
async function doLogin(e) {
  e.preventDefault();
  hideError(); hideNotice();
  let email, pin, want;
  if (mode === "family") {
    const acct = $("acctInput").value.trim().toUpperCase();
    pin = $("pinInput").value;
    if (!/^JX[0-9]{6}$/.test(acct)) return showError("請輸入學生帳號，例如 JX115001");
    if (!/^[0-9]{4}$/.test(pin)) return showError("請輸入 4 位數密碼");
    email = acct.toLowerCase() + EMAIL_DOMAIN;
    want = ["student"];
  } else {
    const id = normStaffAcct($("staffAcctInput").value);
    pin = $("staffPwdInput").value;
    if (!id) return showError("請輸入登入帳號，例如 t_account");
    if (!/^(admin|t_[a-z0-9_-]{1,60})$/.test(id)) return showError("登入帳號格式不正確，老師帳號以 t_ 開頭，例如 t_account");
    if (!pin) return showError("請輸入密碼");
    email = id + EMAIL_DOMAIN;
    want = id === "admin" ? ["admin"] : ["teacher"];
  }

  busy(true);
  try {
    // 密碼由伺服器的登入閘門驗證（錯 3 次鎖 1 分鐘）
    let gate = null;
    for (let i = 0; i < 3; i++) {
      gate = await sbAnon.functions.invoke("login", { body: { email, pin } });
      if (!gate.error && gate.data) break;
      const st = gate.error && gate.error.context && gate.error.context.status;
      if ((st && st < 500) || i === 2) break;
      await new Promise(r => setTimeout(r, 700 * (i + 1)));
    }
    if (gate.error || !gate.data) return showError("無法連線，請檢查網路後再試一次");
    const g = gate.data;
    if (g.status === "locked") return showError("已連續輸錯 3 次，請 1 分鐘後再試");
    if (g.status === "denied") {
      const left = typeof g.remaining === "number" ? g.remaining : null;
      return showError(left === null ? "帳號或密碼錯誤" : `帳號或密碼錯誤，還有 ${left} 次機會（連續錯 3 次會暫時鎖定 1 分鐘）`);
    }
    if (g.status !== "ok") return showError("登入服務暫時無法使用，請稍後再試");

    const set = await sb.auth.setSession({ access_token: g.access_token, refresh_token: g.refresh_token });
    if (set.error || !set.data.session) return showError("登入失敗，請再試一次");

    const me = await loadMe();
    if (!me || !want.includes(me.role)) {
      await sb.auth.signOut({ scope: "local" });
      return showError("帳號或密碼錯誤");
    }
    shareWithLearning(set.data.session, me);
    saveRemember(mode === "staff" ? normStaffAcct($("staffAcctInput").value) : $("acctInput").value.trim().toUpperCase());
    $("pinInput").value = ""; $("staffPwdInput").value = ""; hidePasswords();
    if (goNext(me)) return;
    showPortal(me);
  } catch (err) {
    showError("登入時發生錯誤：" + (err.message || err));
  } finally {
    busy(false);
  }
}

async function loadMe() {
  const { data: s } = await sb.auth.getSession();
  if (!s || !s.session) return null;
  const p = await sb.from("profiles").select("role,student_id,display_name,login_id,title").eq("id", s.session.user.id).maybeSingle();
  if (p.error || !p.data) return null;
  const me = Object.assign({}, p.data);
  if (me.role === "student") {
    const st = await sb.from("students").select("name,grade,school,account_code").eq("id", me.student_id).maybeSingle();
    if (st.data) Object.assign(me, { name: st.data.name, grade: st.data.grade, school: st.data.school, account: st.data.account_code });
  }
  return me;
}

// 學習通讀這幾個欄位判斷是否已登入
function shareWithLearning(session, me) {
  try {
    sessionStorage.setItem("authToken", session.access_token);
    sessionStorage.setItem("isTeacherLoggedIn", me.role === "student" ? "false" : "true");
    if (me.role === "student") sessionStorage.setItem("loggedInStudentId", me.student_id);
    else sessionStorage.removeItem("loggedInStudentId");
    sessionStorage.setItem("lastActivityTime", String(Date.now()));
    sessionStorage.setItem("jx-me", JSON.stringify({ role: me.role, name: me.role === "student" ? (me.name || "") : (me.display_name || me.login_id) }));
  } catch (_) { /* 忽略 */ }
}

async function logout() {
  busy(true);
  try { await sb.auth.signOut({ scope: "local" }); } catch (_) { /* 忽略 */ }
  ["authToken", "isTeacherLoggedIn", "loggedInStudentId", "lastActivityTime", "jx-me"].forEach(k => { try { sessionStorage.removeItem(k); } catch (_) {} });
  busy(false);
  showLogin();
}

/* ==================== 登入後回到原本要去的系統（?next=） ==================== */
const NEXT = (() => { try { return new URLSearchParams(location.search).get("next") || ""; } catch (_) { return ""; } })();
const NEXT_TARGET = {
  learning: { url: LEARNING_URL, roles: ["admin", "teacher", "student"], name: "學習通" },
  rollcall: { url: ROLLCALL_URL, roles: ["admin", "teacher"], name: "雲點名" },
  accounts: { url: "accounts/", roles: ["admin"], name: "帳號管理" }
};
function clearNext() { try { if (NEXT) history.replaceState(null, "", location.pathname); } catch (_) { /* 忽略 */ } }
// 有權限就直接進去，回傳 true；沒有權限就留在入口
function goNext(me) {
  const t = NEXT_TARGET[NEXT];
  if (t && me && t.roles.includes(me.role)) { location.replace(t.url); return true; }
  clearNext();
  return false;
}

/* ==================== 入口卡片 ==================== */
const ICONS = {
  rollcall: '<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
  learning: '<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 013 3v12a2 2 0 00-2-2H2z"/><path d="M22 5h-7a3 3 0 00-3 3v12a2 2 0 012-2h8z"/></svg>',
  roster: '<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.5 3.5 0 010 7M21 20c0-2.6-1.6-4.8-4-5.6"/></svg>',
  tuition: '<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  accounts: '<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>'
};
const CARDS = {
  rollcall: { title: "雲點名", en: "JX CloudCheck", desc: "點名、預約請假與進班、連續請假、點名日設定", href: ROLLCALL_URL, cta: "進入雲點名", bg: "#DBEAFE", fg: "#0F4FB8" },
  learning: { title: "學習通", en: "JX Learning", desc: "進度管理、作業派發、送出審核、學習成長、電子聯絡簿", href: LEARNING_URL, cta: "進入學習通", bg: "#E0EAFF", fg: "#1D4ED8" },
  learningFamily: { title: "學習通", en: "JX Learning", desc: "今日作業、送出審核、電子聯絡簿", href: LEARNING_URL, cta: "進入學習通", bg: "#E0EAFF", fg: "#1D4ED8" },
  roster: { title: "學生名冊", en: "Student Roster", desc: "學生資料、學生帳號與密碼、聯絡電話、進點名與學習通開關", href: "roster/", cta: "進入學生名冊", bg: "#FEF3C7", fg: "#92400E" },
  tuition: { title: "學費管理", en: "Tuition", desc: "產生每月學費單、登記繳費、追蹤未繳", tag: "規劃中", bg: "#D1FAE5", fg: "#047857" },
  tuitionFamily: { title: "學費單", en: "Tuition", desc: "每月學費明細與繳費紀錄", tag: "規劃中", bg: "#D1FAE5", fg: "#047857" },
  accounts: { title: "帳號管理", en: "Accounts", desc: "新增老師、指定負責班級與年級、重設密碼、刪除、排序", href: "accounts/", cta: "進入帳號管理", bg: "#E2E8F0", fg: "#334155" }
};
const BY_ROLE = {
  admin: ["rollcall", "learning", "roster", "tuition", "accounts"],
  teacher: ["rollcall", "learning"],
  student: ["learningFamily", "tuitionFamily"]
};
const ICON_OF = { learningFamily: "learning", tuitionFamily: "tuition" };

function cardHtml(key) {
  const c = CARDS[key];
  const icon = ICONS[ICON_OF[key] || key];
  const head = `
    <div class="card-icon" style="background:${c.bg};color:${c.fg}">${icon}</div>
    <div>
      <div class="card-title">${esc(c.title)}${c.tag ? ` <span class="tag">${esc(c.tag)}</span>` : ""}</div>
      <div class="card-en">${esc(c.en)}</div>
    </div>
    <p class="card-desc">${esc(c.desc)}</p>
    ${c.note ? `<p class="card-note">${esc(c.note)}</p>` : ""}`;
  if (!c.href) return `<div class="card off" aria-disabled="true">${head}<div class="card-cta">${esc(c.tag || "尚未開放")}</div></div>`;
  return `<a class="card" href="${esc(c.href)}">${head}<div class="card-cta">${esc(c.cta)}</div></a>`;
}

function showPortal(me) {
  const roleName = me.role === "teacher" ? (me.title || "老師") : ({ admin: "管理員", student: "學生・家長" }[me.role] || "");
  $("roleChip").textContent = roleName;
  if (me.role === "student") {
    $("greetTitle").textContent = `您好，${me.name || "同學"}`;
    $("greetSub").textContent = [me.school, me.grade, me.account].filter(Boolean).join("・");
  } else {
    $("greetTitle").textContent = `您好，${me.role === "admin" ? "管理員" : (me.display_name || "老師")}`;
    $("greetSub").textContent = "選擇要進入的系統";
  }
  $("cards").innerHTML = (BY_ROLE[me.role] || []).map(cardHtml).join("");
  $("loginView").classList.add("hidden");
  $("portalView").classList.remove("hidden");
  document.title = "基翔學務雲｜基翔文理補習班";
}

function showLogin(fromApp) {
  if (fromApp) showNotice(); else hideNotice();
  $("portalView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  fillRemembered();
}

/* ==================== 啟動 ==================== */
const EYE = { off: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', on: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.6A10 10 0 0112 5.5c6.4 0 10 6.5 10 6.5a17 17 0 01-3.2 4M6.6 6.6C3.7 8.4 2 12 2 12s3.6 6.5 10 6.5c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>' };
document.querySelectorAll(".eye").forEach(btn => {
  btn.innerHTML = EYE.off;
  btn.addEventListener("click", () => {
    const input = $(btn.dataset.eye);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.innerHTML = show ? EYE.on : EYE.off;
    btn.setAttribute("aria-pressed", String(show));
    btn.setAttribute("aria-label", show ? "隱藏密碼" : "顯示密碼");
  });
});
function hidePasswords() {
  document.querySelectorAll(".eye").forEach(btn => { $(btn.dataset.eye).type = "password"; btn.innerHTML = EYE.off; btn.setAttribute("aria-pressed", "false"); btn.setAttribute("aria-label", "顯示密碼"); });
}
["rememberFamily", "rememberStaff"].forEach(id => $(id).addEventListener("change", e => {
  if (e.target.checked) return;
  const r = readRemember();               // 取消勾選：馬上忘記這台裝置記住的帳號
  r[id === "rememberStaff" ? "staff" : "family"] = "";
  writeRemember(r);
}));
$("tabFamily").addEventListener("click", () => setMode("family"));
$("tabStaff").addEventListener("click", () => setMode("staff"));
$("loginForm").addEventListener("submit", doLogin);
$("logoutBtn").addEventListener("click", logout);
$("acctInput").addEventListener("input", e => { e.target.value = e.target.value.toUpperCase(); });

(async () => {
  const last = parseInt(sessionStorage.getItem("lastActivityTime") || "0", 10);
  if (last && Date.now() - last > 60 * 60 * 1000) { await logout(); return; }
  const me = await loadMe().catch(() => null);
  if (me) {
    const { data: s } = await sb.auth.getSession();
    if (s && s.session) shareWithLearning(s.session, me);
    if (goNext(me)) return;
    showPortal(me);
  }
  else {
    let fromApp = false;
    try { fromApp = sessionStorage.getItem("jx-notice") !== null; } catch (_) { /* 忽略 */ }
    showLogin(fromApp);
    const t = NEXT_TARGET[NEXT];
    if (t && !fromApp) { $("loginNoticeText").textContent = `請先登入，登入後會直接進入${t.name}`; $("loginNotice").classList.remove("hidden"); }
  }
})();
</script>
