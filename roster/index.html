<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學生名冊｜基翔學務雲</title>
<script>
  // 沒有從學務雲登入就回登入頁
  try { if (!sessionStorage.getItem("jx-auth")) location.replace("../"); } catch (e) { /* 忽略 */ }
</script>
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --bg: #F1F5F9; --card: #FFFFFF; --line: #E2E8F0; --line-2: #CBD5E1;
    --text: #1E293B; --muted: #64748B; --muted-2: #475569;
    --blue: #1660D6; --blue-d: #0F4FB8; --blue-l: #DBEAFE;
    --gold: #F5B301; --green: #047857; --green-l: #D1FAE5; --rose: #BE123C; --rose-l: #FFE4E6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif; min-height: 100vh; }
  button, input, select, textarea { font: inherit; }
  .hidden { display: none !important; }

  .hero { background: linear-gradient(90deg, #0F4FB8, #1D8CF0); color: #fff; padding: 0 20px 96px; }
  .hero-inner { max-width: 1200px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: #fff; overflow: hidden; box-shadow: 0 2px 8px rgba(15,23,42,.18); }
  .logo img { width: 100%; height: 100%; display: block; }
  .brand-name { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  .brand-sub { font-size: 11px; color: #DBEAFE; letter-spacing: .5px; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--gold); color: var(--text); }
  .ghost-btn { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: rgba(255,255,255,.18); color: #fff; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .ghost-btn:hover { background: rgba(255,255,255,.28); }
  .page-title { padding: 10px 0 0; }
  .page-title h1 { margin: 0; font-size: 28px; }
  .page-title p { margin: 8px 0 0; color: #EAF2FF; font-size: 15px; }

  main { max-width: 1200px; margin: -72px auto 0; padding: 0 20px 96px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px 20px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; min-height: 44px; border: 1px solid #D5DEEA; border-radius: 11px; padding: 0 12px; background: #fff; }
  .search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(22,96,214,.15); }
  .search input { border: 0; outline: none; flex: 1; min-width: 0; font-size: 15px; height: 42px; }
  .sel { min-height: 44px; border: 1px solid #D5DEEA; border-radius: 11px; padding: 0 10px; background: #fff; font-size: 14px; color: var(--text); }
  .filters2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .tog { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 999px; cursor: pointer; font-size: 13px; user-select: none; background: #fff; }
  .tog:has(input:checked) { border-color: var(--blue); background: var(--blue-l); color: var(--blue-d); font-weight: 700; }
  .tog input { margin: 0; accent-color: var(--blue); }
  .count { margin-left: auto; font-size: 13px; color: var(--muted); }

  .btn { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; color: var(--text); cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .btn:hover { background: #F8FAFC; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
  .btn.primary:hover { background: var(--blue-d); }
  .btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(22,96,214,.35); outline-offset: 1px; }

  .tbl-wrap { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 700; font-size: 12.5px; color: var(--muted-2); background: #F8FAFC; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr.off td { color: var(--muted); background: #FAFAFB; }
  .acct { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; letter-spacing: .5px; white-space: nowrap; }
  .nm { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .ph { white-space: nowrap; }
  .ph .rel { color: var(--muted); margin-right: 4px; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .pill.on { background: var(--green-l); color: var(--green); }
  .pill.offp { background: #F1F5F9; color: var(--muted); }
  .pill.left { background: var(--rose-l); color: var(--rose); }
  .pin { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pin code { font-size: 16px; font-weight: 700; letter-spacing: 3px; min-width: 52px; display: inline-block; }
  .pin .na { font-size: 12px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; }
  tbody tr[data-id] { cursor: pointer; }
  tbody tr[data-id]:hover td { background: #F8FAFF; }
  tbody tr[data-id]:focus-visible { outline: 3px solid rgba(22,96,214,.35); outline-offset: -3px; }
  .dsec { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .dsec h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .5px; }
  .dl { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; margin: 0; font-size: 15px; }
  .dl dt { color: var(--muted); }
  .dl dd { margin: 0; font-weight: 500; }
  .clist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .clist li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; }
  .clist .rel { color: var(--muted); min-width: 48px; }
  .clist a { color: var(--blue-d); font-weight: 700; text-decoration: none; letter-spacing: .5px; }
  .clist a:hover { text-decoration: underline; }
  .prim { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #FEF3C7; color: #92400E; }
  .dpin { display: flex; align-items: center; gap: 10px; }
  .dpin code { font-size: 22px; font-weight: 700; letter-spacing: 6px; min-width: 80px; }

  dialog { border: 0; border-radius: 18px; padding: 0; width: min(640px, calc(100vw - 24px)); box-shadow: 0 24px 60px rgba(15,23,42,.3); color: var(--text); }
  dialog.narrow { width: min(440px, calc(100vw - 24px)); }
  dialog::backdrop { background: rgba(15,23,42,.45); }
  .dlg-head { padding: 18px 20px 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .dlg-head h3 { margin: 0; font-size: 19px; }
  .dlg-body { padding: 14px 20px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 170px); overflow: auto; }
  .dlg-foot { padding: 12px 20px 18px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1.3fr 1fr .7fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; color: #334155; }
  .field input, .field select, .field textarea { min-height: 44px; border: 1px solid #D5DEEA; border-radius: 10px; padding: 0 12px; font-size: 15px; background: #fff; width: 100%; }
  .field textarea { padding: 10px 12px; min-height: 64px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px rgba(22,96,214,.15); }
  .help { font-size: 12.5px; color: var(--muted); font-weight: 400; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { font-size: 14px; font-weight: 500; color: #334155; padding: 0; margin-bottom: 8px; }
  .crow { display: grid; grid-template-columns: 1fr 1.6fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .crow input[type=text], .crow input[type=tel] { min-height: 42px; border: 1px solid #D5DEEA; border-radius: 10px; padding: 0 10px; font-size: 15px; width: 100%; }
  .crow label { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; cursor: pointer; font-size: 14px; user-select: none; }
  .checks label:has(input:checked) { border-color: var(--blue); background: var(--blue-l); color: var(--blue-d); font-weight: 700; }
  .checks input { accent-color: var(--blue); width: 16px; height: 16px; margin: 0; }
  .switches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sw { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .sw input { appearance: none; width: 40px; height: 24px; border-radius: 999px; background: #CBD5E1; position: relative; cursor: pointer; transition: background .15s; flex: 0 0 40px; margin: 0; }
  .sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .sw input:checked { background: var(--blue); }
  .sw input:checked::after { left: 19px; }
  .err { font-size: 14px; color: var(--rose); background: var(--rose-l); border-radius: 10px; padding: 10px 12px; margin: 0; }
  .acct-box { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; color: var(--blue-d); background: var(--blue-l); padding: 2px 10px; border-radius: 8px; }

  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 9000; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
  #toast.bad { background: var(--rose); }
  .busy { position: fixed; inset: 0; background: rgba(15,23,42,.3); display: flex; align-items: center; justify-content: center; z-index: 9400; color: #fff; font-size: 16px; font-weight: 700; }
  .test-tag { position: fixed; left: 8px; bottom: 8px; z-index: 99; background: #7c3aed; color: #fff; font: 700 11px/1 sans-serif; padding: 6px 10px; border-radius: 999px; opacity: .9; pointer-events: none; }

  /* 帳密小卡 */
  #cardBtn, #dCard { color: var(--blue); border: 1.5px solid var(--blue); font-weight: 700; }
  #cardBtn:hover, #dCard:hover { background: var(--blue-l); }
  dialog.wide { width: min(920px, calc(100vw - 24px)); }
  .plist { border: 1px solid var(--line); border-radius: 12px; max-height: 300px; overflow: auto; }
  .plist label { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .plist label:last-child { border-bottom: 0; }
  .plist label:hover { background: #F8FAFF; }
  .plist input { accent-color: var(--blue); width: 18px; height: 18px; margin: 0; flex: 0 0 18px; }
  .plist .a { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--muted); margin-left: auto; }
  .pick-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .pick-tools .search { flex: 1 1 200px; min-height: 40px; }
  .pick-tools .search input { height: 38px; }
  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .ccard { margin: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
  .ccard img { display: block; width: 100%; height: auto; }
  .ccard figcaption { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 14px; font-weight: 700; flex-wrap: wrap; }
  .ccard .btns { display: flex; gap: 6px; }
  .warn { font-size: 13.5px; color: #92400E; background: #FEF3C7; border-radius: 10px; padding: 10px 12px; margin: 0; }
  #printArea { display: none; }
  @media print {
    @page { size: A4; margin: 10mm; }
    body > *:not(#printArea) { display: none !important; }
    dialog { display: none !important; }
    body { background: #fff; }
    #printArea { display: grid; grid-template-columns: 92mm 92mm; gap: 5mm; }
    #printArea img { width: 92mm; height: auto; border: 1px dashed #94A3B8; break-inside: avoid; }
  }

  /* 手機：表格改成卡片 */
  @media (max-width: 760px) {
    .hero { padding: 0 14px 88px; }
    .page-title h1 { font-size: 24px; }
    main { padding: 0 10px 96px; }
    .panel { padding: 14px; }
    .count { width: 100%; margin-left: 0; }
    .tbl-wrap { border: 0; overflow: visible; }
    table, tbody, tr, td { display: block; }
    thead { display: none; }
    tr { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
    td { border: 0; padding: 2px 0; }
    td.c-name { grid-column: 1; }
    td.c-acct { grid-column: 2; grid-row: 1; text-align: right; }
    td.c-school, td.c-bday, td.c-phone, td.c-flags { grid-column: 1 / -1; }
    td.c-bday:empty { display: none; }
    td.c-pin { grid-column: 1; }
    td.c-act { grid-column: 2; text-align: right; }
    .grid2, .grid3 { grid-template-columns: 1fr; }
    .switches { grid-template-columns: 1fr; }
    .crow { grid-template-columns: 1fr 1.4fr; }
    .crow label { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <div class="topbar">
      <a class="brand" href="../">
        <div class="logo"><img src="../logo.png" alt="基翔 logo"></div>
        <div><div class="brand-name">基翔學務雲</div><div class="brand-sub">JX EduCloud</div></div>
      </a>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="chip">管理員</span>
        <a class="ghost-btn" href="../">回首頁</a>
        <button type="button" class="ghost-btn" id="logoutBtn">登出</button>
      </div>
    </div>
    <div class="page-title">
      <h1>學生名冊</h1>
      <p>學生資料以這裡為準，雲點名、學習通共用同一份</p>
    </div>
  </div>
</div>

<main>
  <section class="panel" aria-label="學生列表">
    <div class="toolbar">
      <label class="search" aria-label="搜尋">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="搜尋姓名、帳號或電話">
      </label>
      <select class="sel" id="fSchoolF" aria-label="學校"><option value="">全部學校</option></select>
      <select class="sel" id="fGradeF" aria-label="年級"><option value="">全部年級</option></select>
      <select class="sel" id="fStatus" aria-label="在學狀態">
        <option value="active">在學</option>
        <option value="left">已離班</option>
        <option value="all">全部</option>
      </select>
      <button type="button" class="btn" id="cardBtn">帳密小卡</button>
      <button type="button" class="btn primary" id="addBtn">＋ 新增學生</button>
    </div>
    <div class="filters2">
      <label class="tog"><input type="checkbox" id="fRc">進點名</label>
      <label class="tog"><input type="checkbox" id="fLn">學習通</label>
      <label class="tog"><input type="checkbox" id="fNoContact">缺聯絡電話</label>
      <span class="count" id="count"></span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>帳號</th><th>姓名</th><th>學校・年級班級</th><th>生日</th><th>主要聯絡電話</th><th>使用</th><th>學生密碼</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="8" class="empty">讀取中…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<!-- 學生詳細資料 -->
<dialog id="dDlg" aria-labelledby="dName">
  <div class="dlg-head"><h3 id="dName"></h3><span class="acct-box" id="dAcct"></span><span id="dPills"></span></div>
  <div class="dlg-body" id="dBody"></div>
  <div class="dlg-foot">
    <button type="button" class="btn" data-close>關閉</button>
    <button type="button" class="btn" id="dCard">帳密小卡</button>
    <button type="button" class="btn" id="dReset">重設密碼</button>
    <button type="button" class="btn primary" id="dEdit">編輯</button>
  </div>
</dialog>

<!-- 新增／編輯學生 -->
<dialog id="sDlg" aria-labelledby="sDlgTitle">
  <form method="dialog" id="sForm" novalidate>
    <div class="dlg-head"><h3 id="sDlgTitle">新增學生</h3><span class="acct-box hidden" id="sAcct"></span></div>
    <div class="dlg-body">
      <div class="grid2">
        <label class="field">姓名<input type="text" id="sName" maxlength="40" autocomplete="off"></label>
        <label class="field">出生年月日<input type="date" id="sBday"></label>
      </div>
      <div class="grid3">
        <label class="field">學校<select id="sSchool"></select></label>
        <label class="field">年級<select id="sGrade"></select></label>
        <label class="field">班<input type="number" id="sCls" min="1" max="99" inputmode="numeric" placeholder="例 6"></label>
      </div>
      <p class="help" id="sAcctHelp" style="margin:-6px 0 0"></p>

      <fieldset>
        <legend>聯絡電話（最多 3 組，選一位主要聯絡人）</legend>
        <div id="sContacts"></div>
      </fieldset>

      <div class="switches">
        <label class="sw">在學<input type="checkbox" id="sActive" role="switch"></label>
        <label class="sw">進點名<input type="checkbox" id="sRc" role="switch"></label>
        <label class="sw">學習通<input type="checkbox" id="sLn" role="switch"></label>
      </div>
      <label class="field hidden" id="sPinWrap">學習通初始密碼（4 位數字）
        <input type="text" id="sPin" maxlength="4" inputmode="numeric" autocomplete="off">
        <span class="help">第一次開啟學習通會建立帳號，請把帳號和密碼交給家長</span>
      </label>

      <fieldset>
        <legend>學習通班級</legend>
        <div class="checks" id="sClasses"></div>
      </fieldset>
      <fieldset>
        <legend>固定不進班（雲點名）</legend>
        <div class="checks" id="sDays"></div>
      </fieldset>
      <fieldset id="sFeeBox" class="hidden">
        <legend>收費設定 <span class="help">勾選上的班，並選月繳或期繳；批次建立學費單時會依此帶入</span></legend>
        <div id="sFee" style="display:flex;flex-direction:column;gap:8px"></div>
      </fieldset>
      <label class="field">備註<textarea id="sNote" maxlength="200" placeholder="例如：星期五下午家長接"></textarea></label>
      <p class="err hidden" id="sErr" role="alert"></p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" data-close>取消</button>
      <button type="submit" class="btn primary">儲存</button>
    </div>
  </form>
</dialog>

<!-- 重設學生密碼 -->
<dialog id="pDlg" class="narrow" aria-labelledby="pDlgTitle">
  <form method="dialog" id="pForm" novalidate>
    <div class="dlg-head"><h3 id="pDlgTitle">重設學生密碼</h3></div>
    <div class="dlg-body">

<script>
const SUPABASE_URL = "https://jflnvliefjfxhfwjzqdi.supabase.co";      // 測試專案
const SUPABASE_KEY = "sb_publishable_ZVT08ujYz6NmsowKmqBNng_JxBJaVmb";
const PORTAL_URL = "../";
const GRADES = ["一年級", "二年級", "三年級", "四年級", "五年級", "六年級"];
const DOW = ["週一", "週二", "週三", "週四", "週五"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storage: window.sessionStorage, storageKey: "jx-auth" }
});
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let STUDENTS = [], SCHOOLS = [], CLASSES = [], editing = null;
let PROGRAMS = [], ENROLLS = [];

/* ---------- 共用 ---------- */
function busy(on) { $("busy").classList.toggle("hidden", !on); }
let toastTimer;
function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.className = bad ? "bad" : "";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 3200);
}
function friendly(err) {
  const m = (err && err.message) || String(err || "");
  if (/admin_list_students|admin_save_student|admin_set_student_pin|Could not find the function/i.test(m)) return "資料庫還沒安裝學生名冊的更新（測試專案_學生名冊.sql），請先在 SQL Editor 執行";
  if (/admin only|42501|JWT|not authenticated/i.test(m)) return "沒有權限或登入已過期，請重新登入";
  if (/name required/.test(m)) return "請輸入姓名";
  if (/school required/.test(m)) return "請選擇學校";
  if (/grade required/.test(m)) return "請選擇年級";
  if (/class number/.test(m)) return "班級請填 1～99";
  if (/contacts must/.test(m)) return "聯絡電話最多 3 組";
  if (/pin required/.test(m)) return "第一次開啟學習通，請設定 4 位數初始密碼";
  if (/password must be 4/.test(m)) return "密碼必須是 4 位數字";
  if (/no login/.test(m)) return "這位學生還沒有學習通帳號，請先開啟學習通";
  if (/class not found/.test(m)) return "找不到這個班級，請重新整理後再試";
  if (/流水號已用完/.test(m)) return "這一屆的帳號流水號已用完";
  if (/Failed to fetch|NetworkError/i.test(m)) return "無法連線，請檢查網路後再試一次";
  return "發生錯誤：" + m;
}
async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) throw error;
  return data;
}
async function goPortal(msg) {
  try { await sb.auth.signOut({ scope: "local" }); } catch (_) { /* 忽略 */ }
  ["authToken", "isTeacherLoggedIn", "loggedInStudentId", "lastActivityTime", "jx-me"].forEach(k => { try { sessionStorage.removeItem(k); } catch (_) {} });
  try { sessionStorage.setItem("jx-notice", msg || ""); } catch (_) { /* 忽略 */ }
  location.replace(PORTAL_URL);
}
const gradeNo = g => GRADES.indexOf(g) + 1;
const gradeText = s => (s.grade || "") + (s.school_class ? ` ${s.school_class} 班` : "");
const primaryContact = s => { const c = Array.isArray(s.contacts) ? s.contacts : []; return c.find(x => x.primary) || c[0] || null; };
const fmtBday = d => d ? d.replace(/-/g, "/") : "";

/* ---------- 閒置 60 分鐘自動登出 ---------- */
const IDLE_MS = 60 * 60 * 1000;
function touch() { try { sessionStorage.setItem("lastActivityTime", String(Date.now())); } catch (_) {} }
let lastTouch = 0;
["mousedown", "keydown", "touchstart", "scroll"].forEach(ev => window.addEventListener(ev, () => {
  if (Date.now() - lastTouch > 15000) { lastTouch = Date.now(); touch(); }
}, { passive: true, capture: true }));
setInterval(() => {
  const last = parseInt(sessionStorage.getItem("lastActivityTime") || "0", 10);
  if (last && Date.now() - last > IDLE_MS) goPortal("閒置超過 60 分鐘，已自動登出");
}, 15000);

/* ---------- 讀資料 ---------- */
async function load() {
  const [st, sc, cl] = await Promise.all([
    sb.rpc("admin_list_students"),
    sb.from("schools").select("id,name,active,sort_order"),
    sb.from("classes").select("id,name,sort_order")
  ]);
  for (const r of [st, sc, cl]) if (r.error) throw r.error;
  try {
    const [pg, en] = await Promise.all([sb.from("fee_programs").select("code,name,active,sort_order").order("sort_order"), sb.from("fee_enrollments").select("*")]);
    PROGRAMS = pg.error ? [] : (pg.data || []); ENROLLS = en.error ? [] : (en.data || []);
  } catch (_) { PROGRAMS = []; ENROLLS = []; }
  STUDENTS = st.data || [];
  SCHOOLS = (sc.data || []).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  CLASSES = (cl.data || []).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  const curS = $("fSchoolF").value, curG = $("fGradeF").value;
  $("fSchoolF").innerHTML = '<option value="">全部學校</option>' + SCHOOLS.filter(s => s.active).map(s => `<option>${esc(s.name)}</option>`).join("");
  $("fGradeF").innerHTML = '<option value="">全部年級</option>' + GRADES.map(g => `<option>${g}</option>`).join("");
  $("fSchoolF").value = curS; $("fGradeF").value = curG;
  render();
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const qd = q.replace(/\D/g, "");
  const school = $("fSchoolF").value, grade = $("fGradeF").value, status = $("fStatus").value;
  return STUDENTS.filter(s => {
    if (status === "active" && !s.active) return false;
    if (status === "left" && s.active) return false;
    if (school && s.school !== school) return false;
    if (grade && s.grade !== grade) return false;
    if ($("fRc").checked && !s.in_rollcall) return false;
    if ($("fLn").checked && !s.learning_enabled) return false;
    const contacts = Array.isArray(s.contacts) ? s.contacts : [];
    if ($("fNoContact").checked && contacts.some(c => c.phone)) return false;
    if (q) {
      const hay = [s.name, s.account_code, s.school].join(" ").toLowerCase();
      const phones = contacts.map(c => String(c.phone || "").replace(/\D/g, "")).join(" ");
      if (!hay.includes(q) && !(qd.length >= 3 && phones.includes(qd))) return false;
    }
    return true;
  }).sort(cmpStudent);
}
function cmpStudent(a, b) {
  return gradeNo(a.grade) - gradeNo(b.grade) || (a.school_class || 0) - (b.school_class || 0)
    || String(a.school).localeCompare(String(b.school), "zh-Hant") || String(a.name).localeCompare(String(b.name), "zh-Hant");
}

function render() {
  shownPinId = null;
  const list = filtered();
  $("count").textContent = `共 ${list.length} 位`;
  if (!list.length) { $("tbody").innerHTML = '<tr><td colspan="8" class="empty">沒有符合條件的學生</td></tr>'; return; }
  $("tbody").innerHTML = list.map(s => {
    const pc = primaryContact(s);
    const pinCell = !s.has_login ? '<span class="na">尚未開通</span>'
      : !s.pin_viewable ? '<span class="na" title="舊密碼無法還原，重設後就能查看">重設後可查看</span>'
      : `<code data-pin="${esc(s.id)}">••••</code><button type="button" class="btn sm" data-act="pin" data-id="${esc(s.id)}" aria-pressed="false">顯示</button>`;
    return `<tr class="${s.active ? "" : "off"}" data-id="${esc(s.id)}" tabindex="0" aria-label="查看 ${esc(s.name)} 的詳細資料">
      <td class="c-acct"><span class="acct">${esc(s.account_code || "—")}</span></td>
      <td class="c-name"><div class="nm">${esc(s.name)}</div>${s.note ? `<div class="sub">${esc(s.note)}</div>` : ""}</td>
      <td class="c-school">${esc(s.school)}・${esc(gradeText(s))}</td>
      <td class="c-bday">${esc(fmtBday(s.birthday))}</td>
      <td class="c-phone">${pc ? `<span class="ph"><span class="rel">${esc(pc.rel || "")}</span>${esc(pc.phone || "")}</span>` : '<span class="pill left">缺聯絡電話</span>'}</td>
      <td class="c-flags">${s.active ? "" : '<span class="pill left">已離班</span> '}<span class="pill ${s.in_rollcall ? "on" : "offp"}">點名</span> <span class="pill ${s.learning_enabled ? "on" : "offp"}">學習通</span></td>
      <td class="c-pin"><span class="pin">${pinCell}</span></td>
      <td class="c-act" style="white-space:nowrap">
        <button type="button" class="btn sm" data-act="edit" data-id="${esc(s.id)}">編輯</button>
        ${s.has_login ? `<button type="button" class="btn sm" data-act="reset" data-id="${esc(s.id)}">重設密碼</button>` : ""}
      </td></tr>`;
  }).join("");
}

/* ---------- 查看密碼：一次只顯示一位，切換或離開就隱藏，不留紀錄 ---------- */
let shownPinId = null, pinTimer = null;
function hidePin() {
  if (!shownPinId) return;
  document.querySelectorAll(`[data-pin="${CSS.escape(shownPinId)}"]`).forEach(c => { c.textContent = "••••"; });
  document.querySelectorAll(`[data-act="pin"][data-id="${CSS.escape(shownPinId)}"]`).forEach(b => { b.textContent = "顯示"; b.setAttribute("aria-pressed", "false"); });
  shownPinId = null; clearTimeout(pinTimer);
}
async function togglePin(id) {
  if (shownPinId === id) return hidePin();
  hidePin();
  try {
    const pin = await rpc("reveal_student_pin", { p_student_id: id });
    if (!pin) return toast("這位學生的密碼無法查看，請重設密碼", true);
    shownPinId = id;
    document.querySelectorAll(`[data-pin="${CSS.escape(id)}"]`).forEach(c => { c.textContent = pin; });
    document.querySelectorAll(`[data-act="pin"][data-id="${CSS.escape(id)}"]`).forEach(b => { b.textContent = "隱藏"; b.setAttribute("aria-pressed", "true"); });
    pinTimer = setTimeout(hidePin, 30000);   // 30 秒後自動隱藏
  } catch (ex) { toast(friendly(ex), true); }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) hidePin(); });

/* ---------- 詳細資料 ---------- */
let detailId = null;
function openDetail(s) {
  hidePin();
  detailId = s.id;
  const cname = id => (CLASSES.find(c => c.id === id) || {}).name || "（已刪除的班級）";
  const contacts = Array.isArray(s.contacts) ? s.contacts : [];
  const days = s.fixed_off_days || [];
  $("dName").textContent = s.name;
  $("dAcct").textContent = s.account_code || "尚無帳號";
  $("dPills").innerHTML = (s.active ? "" : '<span class="pill left">已離班</span> ')
    + `<span class="pill ${s.in_rollcall ? "on" : "offp"}">點名</span> <span class="pill ${s.learning_enabled ? "on" : "offp"}">學習通</span>`;
  const pinHtml = !s.has_login ? '<span class="help">尚未開通學習通帳號</span>'
    : !s.pin_viewable ? '<span class="help">舊密碼無法還原，按下方「重設密碼」後就能查看</span>'
    : `<span class="dpin"><code data-pin="${esc(s.id)}">••••</code><button type="button" class="btn sm" data-act="pin" data-id="${esc(s.id)}" aria-pressed="false">顯示</button></span>`;
  $("dBody").innerHTML = `
    <section class="dsec"><h4>基本資料</h4><dl class="dl">
      <dt>學校</dt><dd>${esc(s.school)}</dd>
      <dt>年級班級</dt><dd>${esc(gradeText(s))}</dd>
      <dt>出生年月日</dt><dd>${s.birthday ? esc(fmtBday(s.birthday)) : '<span class="help">未填</span>'}</dd>
      <dt>入學學年</dt><dd>${s.entry_year ? esc(s.entry_year) + " 學年入學一年級" : '<span class="help">—</span>'}</dd>
    </dl></section>
    <section class="dsec"><h4>聯絡電話</h4>${contacts.length
      ? `<ul class="clist">${contacts.map(c => `<li><span class="rel">${esc(c.rel || "")}</span><a href="tel:${esc(String(c.phone || "").replace(/[^\d+]/g, ""))}">${esc(c.phone || "")}</a>${c.primary ? '<span class="prim">主要聯絡人</span>' : ""}</li>`).join("")}</ul>`
      : '<span class="pill left">缺聯絡電話</span>'}</section>
    <section class="dsec"><h4>使用的系統</h4><dl class="dl">
      <dt>在學</dt><dd>${s.active ? "是" : "已離班"}</dd>
      <dt>雲點名</dt><dd>${s.in_rollcall ? "進點名" + (days.length ? `，固定不進班：${days.map(d => DOW[d - 1]).join("、")}` : "") : "不進點名"}</dd>
      <dt>學習通</dt><dd>${s.learning_enabled ? "開啟" : "關閉"}${(s.class_ids || []).length ? `，班級：${s.class_ids.map(cname).map(esc).join("、")}` : ""}</dd>
    </dl></section>
    <section class="dsec"><h4>學生密碼</h4>${pinHtml}</section>
    ${s.note ? `<section class="dsec"><h4>備註</h4><div style="white-space:pre-wrap">${esc(s.note)}</div></section>` : ""}`;
  $("dReset").classList.toggle("hidden", !s.has_login);
  $("dCard").classList.toggle("hidden", !(s.active && s.has_login && s.pin_viewable));
  $("dDlg").showModal();
}
$("dBody").addEventListener("click", e => { const b = e.target.closest('button[data-act="pin"]'); if (b) togglePin(b.dataset.id); });
$("dDlg").addEventListener("close", () => { hidePin(); detailId = null; });
$("dEdit").addEventListener("click", () => { const s = STUDENTS.find(x => x.id === detailId); $("dDlg").close(); if (s) openEdit(s); });
$("dReset").addEventListener("click", () => { const s = STUDENTS.find(x => x.id === detailId); $("dDlg").close(); if (s) openReset(s); });
$("dCard").addEventListener("click", () => { const s = STUDENTS.find(x => x.id === detailId); $("dDlg").close(); if (s) openCards(s.id, true); });

/* ---------- 新增／編輯 ---------- */
function contactRow(c, i) {
  return `<div class="crow">
    <input type="text" placeholder="稱謂（例 媽媽）" maxlength="10" value="${esc(c.rel || "")}" data-c="rel" aria-label="第 ${i + 1} 組稱謂">
    <input type="tel" placeholder="電話" maxlength="20" value="${esc(c.phone || "")}" data-c="phone" aria-label="第 ${i + 1} 組電話">
    <label><input type="radio" name="sPrimary" value="${i}" ${c.primary ? "checked" : ""}>主要</label>
  </div>`;
}
function randomPin() { return String(Math.floor(Math.random() * 10000)).padStart(4, "0"); }
function updatePinField() {
  const need = $("sLn").checked && !(editing && editing.has_login);
  $("sPinWrap").classList.toggle("hidden", !need);
  if (need && !$("sPin").value) $("sPin").value = randomPin();
}
function openEdit(s) {
  hidePin();
  editing = s || null;
  $("sDlgTitle").textContent = s ? "編輯學生" : "新增學生";
  $("sAcct").textContent = s && s.account_code ? s.account_code : "";
  $("sAcct").classList.toggle("hidden", !(s && s.account_code));
  $("sAcctHelp").textContent = s ? "帳號在新增時依國小一年級入學學年產生，之後升年級不會改變" : "儲存後會自動產生學生帳號（JX＋入學學年＋流水號）";
  $("sName").value = s ? s.name : "";
  $("sBday").value = s && s.birthday ? s.birthday : "";
  const schools = SCHOOLS.filter(x => x.active || (s && x.name === s.school));
  $("sSchool").innerHTML = '<option value="">請選擇</option>' + schools.map(x => `<option>${esc(x.name)}</option>`).join("");
  $("sSchool").value = s ? s.school : "";
  $("sGrade").innerHTML = '<option value="">請選擇</option>' + GRADES.map(g => `<option>${g}</option>`).join("");
  $("sGrade").value = s ? s.grade : "";
  $("sCls").value = s && s.school_class ? s.school_class : "";
  const cs = (s && Array.isArray(s.contacts) ? s.contacts : []).slice(0, 3);
  while (cs.length < 3) cs.push({});
  if (!cs.some(c => c.primary)) cs[0].primary = true;
  $("sContacts").innerHTML = cs.map(contactRow).join("");
  $("sActive").checked = s ? !!s.active : true;
  $("sRc").checked = s ? !!s.in_rollcall : true;
  $("sLn").checked = s ? !!s.learning_enabled : true;
  $("sPin").value = "";
  updatePinField();
  const myClasses = s ? (s.class_ids || []) : [];
  $("sClasses").innerHTML = CLASSES.length ? CLASSES.map(c => `<label><input type="checkbox" value="${esc(c.id)}" ${myClasses.includes(c.id) ? "checked" : ""}>${esc(c.name)}</label>`).join("")
    : '<span class="help">還沒有任何班級</span>';
  const days = s ? (s.fixed_off_days || []) : [];
  $("sDays").innerHTML = DOW.map((d, i) => `<label><input type="checkbox" value="${i + 1}" ${days.includes(i + 1) ? "checked" : ""}>${d}</label>`).join("");
  $("sNote").value = s ? (s.note || "") : "";
  const ps = PROGRAMS.filter(p => p.active || (s && ENROLLS.some(e => e.student_id === s.id && e.program_code === p.code && e.active)));
  $("sFeeBox").classList.toggle("hidden", !ps.length);
  $("sFee").innerHTML = ps.map(p => {
    const e = s && ENROLLS.find(x => x.student_id === s.id && x.program_code === p.code), on = !!(e && e.active);
    return `<div class="feerow" data-code="${esc(p.code)}" style="display:grid;grid-template-columns:1.2fr 100px 110px;gap:8px;align-items:center">
      <label style="display:flex;align-items:center;gap:8px;font-weight:700"><input type="checkbox" class="fe-on" ${on ? "checked" : ""} style="width:18px;height:18px">${esc(p.name)}</label>
      <select class="fe-b" style="min-height:38px;border:1px solid #D5DEEA;border-radius:9px;padding:0 8px" aria-label="繳費方式"><option value="month">月繳</option><option value="period" ${e && e.billing === "period" ? "selected" : ""}>期繳</option></select>
      <input type="text" class="fe-d" inputmode="numeric" placeholder="每月優惠" value="${e && e.discount ? e.discount : ""}" style="min-height:38px;border:1px solid #D5DEEA;border-radius:9px;padding:0 8px" aria-label="每月優惠"></div>`;
  }).join("");
  $("sErr").classList.add("hidden");
  $("sDlg").showModal();
  $("sName").focus();
}
async function saveStudent(e) {
  e.preventDefault();
  const err = m => { $("sErr").textContent = m; $("sErr").classList.remove("hidden"); $("sErr").scrollIntoView({ block: "nearest" }); };
  const name = $("sName").value.trim();
  if (!name) return err("請輸入姓名");
  if (!$("sSchool").value) return err("請選擇學校");
  if (!$("sGrade").value) return err("請選擇年級");
  const cls = $("sCls").value.trim();
  if (cls && !(+cls >= 1 && +cls <= 99)) return err("班級請填 1～99");
  const primaryIdx = +((document.querySelector('input[name="sPrimary"]:checked') || {}).value || 0);
  let contacts = [...$("sContacts").querySelectorAll(".crow")].map((row, i) => ({
    rel: row.querySelector('[data-c="rel"]').value.trim(),
    phone: row.querySelector('[data-c="phone"]').value.trim(),
    primary: i === primaryIdx
  })).filter(c => c.rel || c.phone);
  if (contacts.some(c => !c.phone)) return err("有聯絡人沒有填電話");
  if (contacts.length && !contacts.some(c => c.primary)) contacts[0].primary = true;
  const pinNeeded = !$("sPinWrap").classList.contains("hidden");
  const pin = $("sPin").value.trim();
  if (pinNeeded && !/^\d{4}$/.test(pin)) return err("學習通初始密碼必須是 4 位數字");
  const payload = {
    id: editing ? editing.id : "",
    name, school: $("sSchool").value, grade: $("sGrade").value, school_class: cls,
    birthday: $("sBday").value, contacts,
    fixed_off_days: [...$("sDays").querySelectorAll("input:checked")].map(i => +i.value),
    class_ids: [...$("sClasses").querySelectorAll("input:checked")].map(i => i.value),
    note: $("sNote").value.trim(),
    active: $("sActive").checked, in_rollcall: $("sRc").checked, learning_enabled: $("sLn").checked,
    pin: pinNeeded ? pin : ""
  };
  busy(true);
  try {
    const res = await rpc("admin_save_student", { p: payload });
    const sid = editing ? editing.id : (res && res.id);
    let feeWarn = false;
    if (sid && !$("sFeeBox").classList.contains("hidden")) {
      const rows = [];
      $("sFee").querySelectorAll(".feerow").forEach(r => {
        const code = r.dataset.code, on = r.querySelector(".fe-on").checked;
        const ex = ENROLLS.find(x => x.student_id === sid && x.program_code === code);
        if (!on && !(ex && ex.active)) return;
        rows.push({ student_id: sid, program_code: code, billing: r.querySelector(".fe-b").value, discount: parseInt(r.querySelector(".fe-d").value.replace(/\D/g, ""), 10) || 0, active: on });
      });
      if (rows.length) { const { error } = await sb.from("fee_enrollments").upsert(rows, { onConflict: "student_id,program_code" }); if (error) feeWarn = true; }
    }
    $("sDlg").close();
    const code = res && res.account_code;
    if (feeWarn) alert("學生資料已儲存，但收費設定沒有存成功（可能沒有權限或資料表尚未建立）。");
    toast(editing ? `已更新 ${name}` : `已新增 ${name}${code ? "，帳號 " + code : ""}${pinNeeded ? "，初始密碼 " + pin : ""}`);
    await load();
  } catch (ex) { err(friendly(ex)); } finally { busy(false); }
}

let pwdTarget = null;
function openReset(s) {

  pwdTarget = s;
  $("pWho").textContent = `${s.name}（${s.account_code || ""}）`;
  $("pNew").value = randomPin();

async function saveReset(e) {

/* ---------- 帳密小卡：做成圖片，可直接傳給家長 ---------- */
const CARD_W = 1000, CARD_H = 620;
const CARD_FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
const CARD_MONO = 'ui-monospace,Menlo,Consolas,"Courier New",monospace';
let cardItems = [], cardSel = new Set(), cardGrades = new Set(), cardTimer = null, logoPromise = null;

const loginUrl = () => new URL("../", location.href).href;
// 可做小卡：在學、已有學習通帳號、密碼可還原
const cardEligible = () => STUDENTS.filter(s => s.active && s.has_login && s.pin_viewable).sort(cmpStudent);
const cardMode = () => (document.querySelector('input[name="cMode"]:checked') || {}).value || "pick";

function cardTargets() {
  const all = cardEligible(), m = cardMode();
  if (m === "all") return all;
  if (m === "grade") return all.filter(s => cardGrades.has(s.grade));
  return all.filter(s => cardSel.has(s.id));
}
function renderCardPick() {
  const q = $("cSearch").value.trim().toLowerCase();
  const list = cardEligible().filter(s => !q || (s.name + " " + (s.account_code || "")).toLowerCase().includes(q));
  $("cList").innerHTML = list.length
    ? list.map(s => `<label><input type="checkbox" value="${esc(s.id)}" ${cardSel.has(s.id) ? "checked" : ""}><b>${esc(s.name)}</b><span class="help">${esc(s.school)}・${esc(gradeText(s))}</span><span class="a">${esc(s.account_code || "")}</span></label>`).join("")
    : '<div class="empty">沒有符合的學生</div>';
}
function renderCardGrades() {
  const all = cardEligible();
  $("cGrade").innerHTML = GRADES.map(g => {
    const n = all.filter(s => s.grade === g).length;
    return n ? `<label><input type="checkbox" value="${g}" ${cardGrades.has(g) ? "checked" : ""}>${g}（${n} 位）</label>` : "";
  }).join("") || '<span class="help">沒有可以產生小卡的學生</span>';
}
function updateCardSummary() {
  const n = cardTargets().length;
  const blocked = STUDENTS.filter(s => s.active && (!s.has_login || !s.pin_viewable)).length;
  $("cAll").textContent = `在學、已開通學習通的全部學生，共 ${cardEligible().length} 位`;
  $("cSum").textContent = `將產生 ${n} 張小卡` + (blocked ? `。另有 ${blocked} 位在學學生沒有可查看的密碼（尚未開通學習通，或舊密碼需先「重設密碼」），不會列入` : "");
  $("cGen").disabled = n === 0;
}
function setCardMode() {
  const m = cardMode();
  $("cPick").classList.toggle("hidden", m !== "pick");
  $("cGrade").classList.toggle("hidden", m !== "grade");
  $("cAll").classList.toggle("hidden", m !== "all");
  updateCardSummary();
}
function cardStep(n) { $("cStep1").classList.toggle("hidden", n !== 1); $("cStep2").classList.toggle("hidden", n !== 2); }

function clearCards() {
  clearTimeout(cardTimer);
  cardItems.forEach(it => URL.revokeObjectURL(it.url));
  cardItems = [];
  $("cGrid").innerHTML = ""; $("printArea").innerHTML = "";
}
function openCards(preId, auto) {
  hidePin(); clearCards();
  cardSel = new Set(preId ? [preId] : []); cardGrades = new Set();
  $("cSearch").value = "";
  document.querySelector('input[name="cMode"][value="pick"]').checked = true;
  renderCardPick(); renderCardGrades(); setCardMode(); cardStep(1);
  $("cDlg").showModal();
  if (auto) genCards();
}

/* 畫一張小卡（PNG） */
const loadLogo = () => logoPromise || (logoPromise = new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = "../logo-full.jpg"; }));
function rrPath(x, a, b, w, h, r) {
  x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r);
  x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();
}
async function drawCard(s, pin) {
  const loginU = loginUrl();
  try { await document.fonts.load('700 60px "Noto Sans TC"', s.name + "基翔學務雲帳號密碼同學登入資料請妥善保管勿將轉給他人掃描"); } catch (_) { /* 用備用字型 */ }
  const logo = await loadLogo();
  const c = document.createElement("canvas"); c.width = CARD_W; c.height = CARD_H;
  const x = c.getContext("2d");
  x.textBaseline = "alphabetic";
  x.fillStyle = "#fff"; x.fillRect(0, 0, CARD_W, CARD_H);
  // 上方藍色標題列
  const g = x.createLinearGradient(0, 0, CARD_W, 0); g.addColorStop(0, "#0F4FB8"); g.addColorStop(1, "#1D8CF0");
  x.fillStyle = g; x.fillRect(0, 0, CARD_W, 200);
  // logo（基翔文理補習班）
  x.fillStyle = "#fff"; rrPath(x, 36, 20, 152, 160, 22); x.fill();
  if (logo) {
    const lh = 144, lw = lh * logo.width / logo.height;
    x.drawImage(logo, 36 + (152 - lw) / 2, 28, lw, lh);
  }
  x.fillStyle = "#fff"; x.font = `700 52px ${CARD_FONT}`; x.fillText("基翔學務雲", 216, 106);
  x.fillStyle = "#DBEAFE"; x.font = `500 24px ${CARD_FONT}`; x.fillText("JX EduCloud", 219, 146);
  x.fillStyle = "#F5B301"; rrPath(x, 790, 76, 170, 48, 24); x.fill();
  x.fillStyle = "#1E293B"; x.font = `700 24px ${CARD_FONT}`; x.textAlign = "center"; x.fillText("登入資料", 875, 109); x.textAlign = "left";
  // 姓名
  let fs = 64; x.font = `700 ${fs}px ${CARD_FONT}`;
  while (x.measureText(s.name).width > 640 && fs > 36) { fs -= 4; x.font = `700 ${fs}px ${CARD_FONT}`; }
  x.fillStyle = "#1E293B"; x.fillText(s.name, 50, 280);
  const nw = x.measureText(s.name).width;
  x.fillStyle = "#64748B"; x.font = `500 32px ${CARD_FONT}`; x.fillText("同學", 50 + nw + 14, 280);
  // 帳號、密碼（左側）
  [["帳號", 310], ["密碼", 430]].forEach(([label, top]) => {
    x.fillStyle = "#F1F5F9"; rrPath(x, 40, top, 650, 100, 20); x.fill();
    x.fillStyle = "#64748B"; x.font = `500 30px ${CARD_FONT}`; x.fillText(label, 72, top + 63);
  });
  x.fillStyle = "#0F4FB8"; x.font = `600 56px ${CARD_MONO}`; x.fillText(s.account_code || "", 240, 380);
  x.fillStyle = "#1E293B"; x.font = `700 70px ${CARD_MONO}`;
  let px = 240; for (const ch of String(pin)) { x.fillText(ch, px, 505); px += x.measureText(ch).width + 20; }
  // 右下角：登入網址 QR Code
  const QS = 220, QX = 730, QY = 310;
  x.fillStyle = "#fff"; rrPath(x, QX, QY, QS, QS, 16); x.fill();
  x.strokeStyle = "#CBD5E1"; x.lineWidth = 2; rrPath(x, QX, QY, QS, QS, 16); x.stroke();
  if (typeof qrcode === "function") {
    const qr = qrcode(0, "M"); qr.addData(loginU); qr.make();
    const n = qr.getModuleCount(), cell = Math.floor((QS - 28) / n), off = Math.floor((QS - cell * n) / 2);
    x.fillStyle = "#1E293B";
    for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) if (qr.isDark(r, q)) x.fillRect(QX + off + q * cell, QY + off + r * cell, cell, cell);
  }
  x.fillStyle = "#1660D6"; x.font = `700 24px ${CARD_FONT}`; x.textAlign = "center"; x.fillText("掃描 QR Code 登入", QX + QS / 2, QY + QS + 36); x.textAlign = "left";
  // 下方說明
  x.fillStyle = "#94A3B8"; x.font = `400 22px ${CARD_FONT}`; x.fillText("請妥善保管，勿將密碼轉給他人", 40, 582);
  x.strokeStyle = "#CBD5E1"; x.lineWidth = 2; x.strokeRect(1, 1, CARD_W - 2, CARD_H - 2);
  return new Promise(res => c.toBlob(res, "image/png"));
}

async function genCards() {
  const list = cardTargets();
  if (!list.length) return;
  clearCards();
  busy(true);
  const skipped = [], pins = new Map();
  let done = 0;
  const prog = () => { $("busy").textContent = `產生中 ${done}／${list.length}…`; };
  prog();
  try {
    const queue = [...list];
    const worker = async () => {
      while (queue.length) {
        const s = queue.shift();
        try {
          const pin = await rpc("reveal_student_pin", { p_student_id: s.id });
          if (pin) pins.set(s.id, pin); else skipped.push(s);
        } catch (ex) { skipped.push(s); }
        done++; prog();
      }
    };
    await Promise.all(Array.from({ length: Math.min(5, list.length) }, worker));
    for (const s of list) {
      const pin = pins.get(s.id);
      if (!pin) continue;
      const blob = await drawCard(s, pin);
      if (!blob) { skipped.push(s); continue; }
      cardItems.push({ id: s.id, name: s.name, blob, url: URL.createObjectURL(blob), fname: `帳密小卡_${s.account_code || "JX"}_${s.name}.png` });
    }
    pins.clear();
    $("cGrid").innerHTML = cardItems.map((it, i) => `<figure class="ccard">
        <img src="${it.url}" alt="${esc(it.name)} 的帳密小卡">
        <figcaption><span>${esc(it.name)}</span><span class="btns">
          <button type="button" class="btn sm primary" data-ca="share" data-i="${i}">傳送</button>
          <button type="button" class="btn sm" data-ca="copy" data-i="${i}">複製</button>
          <button type="button" class="btn sm" data-ca="dl" data-i="${i}">下載</button>
        </span></figcaption></figure>`).join("");
    $("cDone").textContent = `已產生 ${cardItems.length} 張小卡`;
    $("cSkip").classList.toggle("hidden", !skipped.length);
    if (skipped.length) $("cSkip").textContent = `有 ${skipped.length} 位讀不到密碼，沒有產生：${skipped.map(s => s.name).join("、")}。請先「重設密碼」後再試`;
    $("cDlAll").disabled = $("cPrint").disabled = !cardItems.length;
    cardStep(2);
    clearTimeout(cardTimer);
    cardTimer = setTimeout(() => { clearCards(); if ($("cDlg").open) $("cDlg").close(); toast("小卡已超過 10 分鐘，已自動清除"); }, 10 * 60 * 1000);
  } catch (ex) { toast(friendly(ex), true); } finally { busy(false); $("busy").textContent = "處理中…"; }
}

function downloadCard(i) {
  const it = cardItems[i]; if (!it) return;
  const a = document.createElement("a"); a.href = it.url; a.download = it.fname;
  document.body.appendChild(a); a.click(); a.remove();
}
async function shareCard(i) {
  const it = cardItems[i]; if (!it) return;
  const file = new File([it.blob], it.fname, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: `${it.name} 的學務雲登入卡` }); return; }
    catch (ex) { if (ex && ex.name === "AbortError") return; }
  }
  downloadCard(i);
  toast("這個裝置不能直接分享，已改為下載圖片，再從 LINE 傳送");
}
async function copyCard(i) {
  const it = cardItems[i]; if (!it) return;
  try { await navigator.clipboard.write([new ClipboardItem({ "image/png": it.blob })]); toast(`已複製 ${it.name} 的小卡，可到 LINE 直接貼上`); }
  catch (_) { toast("這個瀏覽器無法複製圖片，請改用「下載」", true); }
}
async function downloadAllCards() {
  for (let i = 0; i < cardItems.length; i++) { downloadCard(i); await new Promise(r => setTimeout(r, 400)); }
  toast(`已下載 ${cardItems.length} 張`);
}
async function printCards() {
  const wrap = $("printArea");
  wrap.innerHTML = cardItems.map(it => `<img src="${it.url}" alt="">`).join("");
  try { await Promise.all([...wrap.querySelectorAll("img")].map(im => im.decode().catch(() => {}))); } catch (_) { /* 忽略 */ }
  window.print();
}
window.addEventListener("afterprint", () => { $("printArea").innerHTML = ""; });

$("cardBtn").addEventListener("click", () => openCards(null, false));
$("cDlg").addEventListener("close", clearCards);
document.querySelectorAll('input[name="cMode"]').forEach(r => r.addEventListener("change", setCardMode));
let cTimer; $("cSearch").addEventListener("input", () => { clearTimeout(cTimer); cTimer = setTimeout(renderCardPick, 120); });
$("cList").addEventListener("change", e => {
  if (!e.target.matches('input[type="checkbox"]')) return;
  e.target.checked ? cardSel.add(e.target.value) : cardSel.delete(e.target.value);
  updateCardSummary();
});
$("cGrade").addEventListener("change", e => {
  if (!e.target.matches('input[type="checkbox"]')) return;
  e.target.checked ? cardGrades.add(e.target.value) : cardGrades.delete(e.target.value);
  updateCardSummary();
});
$("cSelAll").addEventListener("click", () => { $("cList").querySelectorAll('input[type="checkbox"]').forEach(i => cardSel.add(i.value)); renderCardPick(); updateCardSummary(); });
$("cSelNone").addEventListener("click", () => { cardSel.clear(); renderCardPick(); updateCardSummary(); });
$("cGen").addEventListener("click", genCards);
$("cBack").addEventListener("click", () => { clearCards(); cardStep(1); });
$("cDlAll").addEventListener("click", downloadAllCards);
$("cPrint").addEventListener("click", printCards);
$("cGrid").addEventListener("click", e => {
  const b = e.target.closest("button[data-ca]"); if (!b) return;
  ({ share: shareCard, copy: copyCard, dl: downloadCard })[b.dataset.ca](+b.dataset.i);
});

/* ---------- 事件 ---------- */
$("tbody").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) {
    const tr = e.target.closest("tr[data-id]");
    const st = tr && STUDENTS.find(x => x.id === tr.dataset.id);
    if (st) openDetail(st);
    return;
  }
  const s = STUDENTS.find(x => x.id === b.dataset.id);
  if (!s) return;
  ({ edit: () => openEdit(s), reset: () => openReset(s), pin: () => togglePin(s.id) })[b.dataset.act]();
});
$("tbody").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-id]")) {
    e.preventDefault();
    const st = STUDENTS.find(x => x.id === e.target.dataset.id);
    if (st) openDetail(st);
  }
});
let qTimer;
$("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(render, 150); });
["fSchoolF", "fGradeF", "fStatus", "fRc", "fLn", "fNoContact"].forEach(id => $(id).addEventListener("change", render));
$("addBtn").addEventListener("click", () => openEdit(null));
$("sLn").addEventListener("change", updatePinField);
$("sForm").addEventListener("submit", saveStudent);
$("pForm").addEventListener("submit", saveReset);
["sPin", "pNew"].forEach(id => $(id).addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); }));
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
$("logoutBtn").addEventListener("click", () => goPortal(""));

/* ---------- 啟動：只有管理員能進來 ---------- */
(async () => {
  busy(true);
  try {
    const last = parseInt(sessionStorage.getItem("lastActivityTime") || "0", 10);
    if (last && Date.now() - last > IDLE_MS) return goPortal("閒置超過 60 分鐘，已自動登出");
    const { data: s } = await sb.auth.getSession();
    if (!s || !s.session) return location.replace(PORTAL_URL);
    const me = await sb.from("profiles").select("role").eq("id", s.session.user.id).maybeSingle();
    if (!me.data || me.data.role !== "admin") return location.replace(PORTAL_URL);
    touch();
    await load();
  } catch (ex) {
    $("tbody").innerHTML = `<tr><td colspan="8" class="empty">${esc(friendly(ex))}</td></tr>`;
  } finally { busy(false); }
})();
</script>
